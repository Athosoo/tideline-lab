/* ------------------------------------------------------------------
   体积云渲染 · 交互演示
   舞台（全屏 WebGL2）+ 仪表台（右侧通栏控制面）
   字体：Space Grotesk 数字 / Noto Sans SC 正文 / Cascadia Mono 读数
   ------------------------------------------------------------------ */

:root {
  --ink: #f2f4f7;
  --ink-2: rgba(242, 244, 247, 0.68);
  --ink-3: rgba(242, 244, 247, 0.52);
  --ink-4: rgba(242, 244, 247, 0.34);
  --line: rgba(255, 255, 255, 0.085);
  --line-2: rgba(255, 255, 255, 0.16);
  --bg: #060708;
  --deck-bg: #08090b;
  --accent: #9bd4ff;
  --deck-w: clamp(324px, 26vw, 392px);
  --ease: cubic-bezier(0.16, 1, 0.3, 1);
  --font-sans: "Noto Sans SC", "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei",
    "Segoe UI", system-ui, sans-serif;
  --font-display: "Space Grotesk", "Noto Sans SC", ui-sans-serif, system-ui, sans-serif;
  --font-mono: "Cascadia Mono", "SFMono-Regular", "JetBrains Mono", Consolas, ui-monospace,
    monospace;
}

*,
*::before,
*::after { box-sizing: border-box; }

html, body { height: 100%; }

body {
  margin: 0;
  display: grid;
  grid-template-columns: minmax(0, 1fr) var(--deck-w);
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-sans);
  font-size: 14px;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

::selection {
  background: color-mix(in srgb, var(--accent) 34%, transparent);
  color: #ffffff;
}
:focus-visible {
  outline: 1px solid var(--accent);
  outline-offset: 3px;
  border-radius: 3px;
}

/* ================= 舞台 ================= */

#stage {
  position: relative;
  min-width: 0;
  overflow: hidden;
  background: var(--bg);
}

#gl {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  cursor: grab;
  touch-action: none;
}
#gl.dragging { cursor: grabbing; }

/* 上下两条压暗，保证叠在云上的文字始终可读 */
#stage::before,
#stage::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  pointer-events: none;
  z-index: 1;
}
#stage::before {
  top: 0;
  height: 20%;
  background: linear-gradient(180deg, rgba(4, 6, 8, 0.44), rgba(4, 6, 8, 0));
}
#stage::after {
  bottom: 0;
  height: 38%;
  background: linear-gradient(180deg, rgba(4, 6, 8, 0), rgba(4, 6, 8, 0.4) 62%, rgba(4, 6, 8, 0.62));
}

/* ---------------- 标题 ---------------- */

#brand {
  position: absolute;
  top: clamp(18px, 2.4vw, 34px);
  left: clamp(20px, 3vw, 44px);
  pointer-events: none;
  user-select: none;
  z-index: 2;
}
#brand h1 {
  margin: 0;
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 0.02em;
  text-shadow: 0 1px 16px rgba(0, 0, 0, 0.42);
}
#brand p {
  margin: 5px 0 0;
  font-size: 11px;
  line-height: 1.5;
  color: rgba(242, 244, 247, 0.66);
  text-shadow: 0 1px 14px rgba(0, 0, 0, 0.5);
}

/* ---------------- 预设 / 太阳高度 ---------------- */

#hero {
  position: absolute;
  left: clamp(20px, 3vw, 44px);
  bottom: clamp(24px, 3vw, 40px);
  display: flex;
  align-items: flex-end;
  gap: clamp(20px, 3vw, 42px);
  pointer-events: none;
  user-select: none;
  z-index: 2;
}

.hero-main { min-width: 0; }

#hero-title {
  margin: 0;
  font-size: clamp(26px, 3.1vw, 40px);
  font-weight: 700;
  line-height: 1.06;
  letter-spacing: -0.02em;
  text-shadow: 0 2px 26px rgba(0, 0, 0, 0.4);
}

#hero-spec {
  margin: 9px 0 0;
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.01em;
  color: rgba(242, 244, 247, 0.72);
  font-variant-numeric: tabular-nums;
  text-shadow: 0 1px 14px rgba(0, 0, 0, 0.55);
}

.hero-sun {
  display: flex;
  flex-direction: column;
  flex: none;
  padding-left: clamp(16px, 2vw, 28px);
  border-left: 1px solid rgba(255, 255, 255, 0.18);
}
.hero-sun b {
  font-family: var(--font-display);
  font-weight: 500;
  font-size: clamp(36px, 4.4vw, 62px);
  line-height: 0.86;
  letter-spacing: -0.035em;
  font-variant-numeric: tabular-nums;
  text-shadow: 0 2px 28px rgba(0, 0, 0, 0.36);
}
.hero-sun b i {
  font-style: normal;
  font-size: 0.4em;
  vertical-align: 0.68em;
  letter-spacing: 0;
  margin-left: 2px;
  opacity: 0.7;
}
.hero-sun > span {
  margin-top: 11px;
  font-size: 10.5px;
  letter-spacing: 0.06em;
  color: rgba(242, 244, 247, 0.62);
  text-shadow: 0 1px 12px rgba(0, 0, 0, 0.5);
}

#hint {
  position: absolute;
  left: 50%;
  bottom: 15px;
  transform: translateX(-50%);
  margin: 0;
  white-space: nowrap;
  font-size: 11px;
  letter-spacing: 0.06em;
  color: rgba(242, 244, 247, 0.44);
  text-shadow: 0 1px 12px rgba(0, 0, 0, 0.5);
  pointer-events: none;
  user-select: none;
  z-index: 2;
}

/* ================= 仪表台 ================= */

#deck {
  position: relative;
  display: flex;
  flex-direction: column;
  min-height: 0;
  background: var(--deck-bg);
  border-left: 1px solid var(--line);
}

/* 顶部一层随预设变色的极淡色雾，给通栏面板一个方向感 */
#deck::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 240px;
  background: linear-gradient(
    180deg,
    color-mix(in srgb, var(--accent) 6%, transparent),
    transparent
  );
  pointer-events: none;
  transition: background 700ms var(--ease);
}

.deck-head {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 22px 22px 0;
}
.deck-head h2 {
  margin: 0;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.01em;
}

#reset {
  appearance: none;
  border: 1px solid var(--line-2);
  background: transparent;
  color: var(--ink-2);
  font-family: inherit;
  font-size: 11.5px;
  padding: 5px 11px;
  border-radius: 6px;
  cursor: pointer;
  transition: color 160ms, border-color 160ms, background 160ms;
}
#reset:hover {
  color: var(--ink);
  border-color: color-mix(in srgb, var(--accent) 55%, transparent);
  background: color-mix(in srgb, var(--accent) 10%, transparent);
}
#reset:active { transform: translateY(0.5px); }

/* 参数区底部渐隐：提示还能继续往下滚 */
#deck::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 34px;
  background: linear-gradient(180deg, transparent, var(--deck-bg));
  pointer-events: none;
}

/* ---------------- 实时读数 ---------------- */

#perf {
  position: relative;
  display: flex;
  flex-wrap: wrap;
  gap: 3px 13px;
  padding: 11px 22px 15px;
  border-bottom: 1px solid var(--line);
  font-family: var(--font-mono);
  font-size: 10.5px;
  letter-spacing: 0.01em;
  color: var(--ink-3);
  font-variant-numeric: tabular-nums;
}
#perf b { font-weight: 500; color: var(--ink); }
#perf #hud-tier { color: var(--ink-2); }

/* ---------------- 预设 ---------------- */

.presets {
  position: relative;
  padding: 7px 0 9px;
  border-bottom: 1px solid var(--line);
}

.preset {
  appearance: none;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  width: 100%;
  padding: 8px 22px;
  border: 0;
  background: transparent;
  color: inherit;
  font-family: inherit;
  text-align: left;
  cursor: pointer;
  transition: background 160ms linear;
}
.preset::before {
  content: "";
  position: absolute;
  left: 0;
  top: 50%;
  width: 2px;
  height: 16px;
  border-radius: 0 2px 2px 0;
  background: var(--accent);
  transform: translateY(-50%) scaleY(0);
  transform-origin: center;
  transition: transform 260ms var(--ease);
}
.preset[aria-pressed="true"]::before { transform: translateY(-50%) scaleY(1); }
.preset:hover { background: rgba(255, 255, 255, 0.035); }

.preset .p-name {
  font-size: 13px;
  color: var(--ink-2);
  transition: color 160ms;
}
.preset[aria-pressed="true"] .p-name { color: var(--ink); }

.preset .p-dots {
  display: flex;
  flex: none;
  gap: 4px;
}
.preset .p-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--c);
  opacity: 0.5;
  transition: opacity 200ms, transform 340ms var(--ease);
}
.preset[aria-pressed="true"] .p-dot,
.preset:hover .p-dot { opacity: 1; }
.preset:hover .p-dot:nth-child(2) { transform: translateY(-2px); }

/* ---------------- 参数分区 ---------------- */

.sections {
  position: relative;
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: 0 22px 28px;
  scrollbar-width: thin;
  scrollbar-color: rgba(255, 255, 255, 0.16) transparent;
}
.sections::-webkit-scrollbar { width: 6px; }
.sections::-webkit-scrollbar-thumb {
  background: rgba(255, 255, 255, 0.14);
  border-radius: 3px;
}
.sections::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.24); }

.section { padding-top: 18px; }
.section + .section {
  margin-top: 18px;
  border-top: 1px solid var(--line);
}

.section-head {
  display: flex;
  align-items: baseline;
  gap: 10px;
  margin-bottom: 12px;
}
.section-head .eyebrow {
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.01em;
  text-transform: none;
  color: var(--ink);
}

.ctrl { margin-bottom: 12px; }
.ctrl:last-child { margin-bottom: 0; }

.ctrl-top {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 4px;
}
.ctrl-label {
  font-size: 11.5px;
  color: var(--ink-2);
  letter-spacing: 0.01em;
}
.ctrl-val {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--ink-3);
  font-variant-numeric: tabular-nums;
  transition: color 160ms;
}
.ctrl:hover .ctrl-val,
.ctrl:focus-within .ctrl-val { color: var(--ink); }

/* ---------------- 滑杆 ---------------- */

input[type="range"] {
  appearance: none;
  -webkit-appearance: none;
  display: block;
  width: 100%;
  height: 20px;
  margin: 0;
  background: transparent;
  cursor: pointer;
}
input[type="range"]::-webkit-slider-runnable-track {
  height: 2px;
  border-radius: 1px;
  background: linear-gradient(
    90deg,
    var(--accent) 0%,
    var(--accent) var(--p, 50%),
    rgba(255, 255, 255, 0.13) var(--p, 50%),
    rgba(255, 255, 255, 0.13) 100%
  );
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 10px;
  height: 10px;
  margin-top: -4px;
  border-radius: 50%;
  border: 0;
  background: #ffffff;
  box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 40%, transparent);
  transition: box-shadow 140ms, transform 140ms;
}
input[type="range"]:hover::-webkit-slider-thumb,
input[type="range"]:active::-webkit-slider-thumb {
  transform: scale(1.15);
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 22%, transparent);
}
input[type="range"]::-moz-range-track {
  height: 2px;
  border-radius: 1px;
  background: rgba(255, 255, 255, 0.13);
}
input[type="range"]::-moz-range-progress {
  height: 2px;
  border-radius: 1px;
  background: var(--accent);
}
input[type="range"]::-moz-range-thumb {
  width: 10px;
  height: 10px;
  border: 0;
  border-radius: 50%;
  background: #ffffff;
}

/* ---------------- 分段按钮 ---------------- */

.chips {
  display: flex;
  gap: 4px;
  margin-bottom: 12px;
}
.chip-btn {
  flex: 1;
  appearance: none;
  border: 1px solid var(--line);
  background: transparent;
  color: var(--ink-3);
  font-family: inherit;
  font-size: 11px;
  padding: 5px 2px;
  border-radius: 5px;
  cursor: pointer;
  white-space: nowrap;
  transition: color 150ms, border-color 150ms, background 150ms;
}
.chip-btn:hover {
  color: var(--ink);
  border-color: var(--line-2);
}
.chip-btn[aria-pressed="true"] {
  color: var(--ink);
  border-color: color-mix(in srgb, var(--accent) 50%, transparent);
  background: color-mix(in srgb, var(--accent) 12%, transparent);
}

/* ---------------- 开关 ---------------- */

.toggle-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 6px 0;
}
.toggle {
  appearance: none;
  width: 30px;
  height: 16px;
  padding: 0;
  border-radius: 8px;
  border: 1px solid var(--line-2);
  background: transparent;
  position: relative;
  cursor: pointer;
  transition: background 200ms, border-color 200ms;
}
.toggle::after {
  content: "";
  position: absolute;
  top: 2px;
  left: 2px;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--ink-4);
  transition: transform 220ms var(--ease), background 200ms;
}
.toggle[aria-pressed="true"] {
  border-color: color-mix(in srgb, var(--accent) 60%, transparent);
  background: color-mix(in srgb, var(--accent) 16%, transparent);
}
.toggle[aria-pressed="true"]::after {
  transform: translateX(14px);
  background: var(--accent);
}

/* ---------------- 注释 ---------------- */

.stat-line {
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px solid var(--line);
  font-family: var(--font-mono);
  font-size: 10px;
  line-height: 1.75;
  color: var(--ink-3);
  letter-spacing: 0.01em;
}
.stat-line b { font-weight: 500; color: var(--ink-2); }

.note {
  margin-top: 16px;
  padding-top: 14px;
  border-top: 1px solid var(--line);
}
.note .eyebrow {
  display: block;
  font-size: 11px;
  font-weight: 600;
  color: var(--ink-2);
  letter-spacing: 0.02em;
}
.note p {
  margin: 6px 0 0;
  font-size: 10.5px;
  line-height: 1.7;
  color: var(--ink-3);
}

/* ================= 加载 / 错误 ================= */

#loader {
  position: fixed;
  inset: 0;
  z-index: 40;
  display: grid;
  place-items: center;
  background: var(--bg);
  transition: opacity 700ms var(--ease), visibility 700ms;
}
#loader.done {
  opacity: 0;
  visibility: hidden;
}
.loader-inner {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  width: min(264px, 68vw);
}
.loader-word {
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.02em;
}
#loader-text {
  margin: 0;
  font-family: var(--font-mono);
  font-size: 10.5px;
  letter-spacing: 0.01em;
  color: var(--ink-3);
  font-variant-numeric: tabular-nums;
  text-align: center;
}
.bar {
  width: 100%;
  height: 1px;
  background: rgba(255, 255, 255, 0.12);
  overflow: hidden;
}
.bar i {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--accent);
  transform: scaleX(0);
  transform-origin: left center;
  transition: transform 240ms var(--ease);
}

#fatal {
  position: fixed;
  inset: 0;
  z-index: 50;
  display: grid;
  place-items: center;
  padding: 40px;
  background: var(--bg);
}
#fatal[hidden] { display: none; }
#fatal pre {
  max-width: 780px;
  margin: 0;
  font-family: var(--font-mono);
  font-size: 12px;
  line-height: 1.7;
  color: #ff9b9b;
  white-space: pre-wrap;
  word-break: break-word;
}

/* ================= 入场 ================= */

@keyframes rise {
  from {
    opacity: 0;
    transform: translateY(14px);
    filter: blur(6px);
  }
  to {
    opacity: 1;
    transform: none;
    filter: none;
  }
}

body.ready #brand { animation: rise 700ms var(--ease) both; }
body.ready #hero { animation: rise 820ms var(--ease) 90ms both; }
body.ready .deck-head { animation: rise 700ms var(--ease) 60ms both; }
body.ready #perf { animation: rise 700ms var(--ease) 120ms both; }
body.ready .presets { animation: rise 700ms var(--ease) 180ms both; }
body.ready .sections { animation: rise 760ms var(--ease) 240ms both; }

#hint { animation: hint-away 900ms var(--ease) 7200ms forwards; }
@keyframes hint-away {
  to { opacity: 0; }
}

/* ================= 窄屏：舞台在上，仪表台变底部抽屉 ================= */

@media (max-width: 960px) {
  body {
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: minmax(0, 1fr) minmax(0, 54dvh);
  }

  #deck {
    border-left: 0;
    border-top: 1px solid var(--line);
    border-radius: 16px 16px 0 0;
    max-height: none;
    overflow: hidden;
  }
  #deck::before { height: 120px; }

  .deck-head { padding: 14px 18px 0; }
  #perf { padding: 9px 18px 12px; }

  .presets {
    display: flex;
    gap: 4px;
    padding: 4px 18px 10px;
    overflow-x: auto;
    scrollbar-width: none;
    /* 右侧渐隐，提示这一排还能横向滑动 */
    mask-image: linear-gradient(90deg, #000 0, #000 calc(100% - 28px), transparent 100%);
  }
  .presets::-webkit-scrollbar { display: none; }
  .preset {
    width: auto;
    flex: none;
    padding: 7px 12px;
    border-radius: 6px;
    border: 1px solid var(--line);
  }
  .preset::before { display: none; }
  .preset[aria-pressed="true"] {
    border-color: color-mix(in srgb, var(--accent) 50%, transparent);
    background: color-mix(in srgb, var(--accent) 12%, transparent);
  }
  .preset .p-dots { display: none; }

  .sections { padding: 0 18px 22px; }

  #brand { top: 16px; left: 16px; }
  #brand h1 { font-size: 13px; }
  #brand p { font-size: 10px; }

  #hero {
    left: 16px;
    bottom: 18px;
    gap: 18px;
  }
  #hero-title { font-size: clamp(22px, 6.4vw, 30px); }
  #hero-spec { margin-top: 7px; font-size: 10px; }
  .hero-sun { padding-left: 14px; }
  .hero-sun b { font-size: clamp(30px, 8vw, 40px); }
  .hero-sun > span { margin-top: 8px; font-size: 9.5px; }

  #hint { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 1ms !important;
    animation-delay: 0ms !important;
    transition-duration: 1ms !important;
  }
  #hint { animation: none; opacity: 0; }
}
</style>
</head>
<body>
<div id="stage">
  <canvas id="gl"></canvas>

  <header id="brand">
    <h1>体积云渲染</h1>
    <p>WebGL2 · 半分辨率步进 · 蓝噪声累积</p>
  </header>

  <div id="hero" aria-live="polite">
    <div class="hero-main">
      <h2 id="hero-title">晴日积云</h2>
      <p id="hero-spec">云量 0.46 · 云底 1050 m · 厚度 3000 m</p>
    </div>
    <div class="hero-sun">
      <b><span id="hero-sun-val">42</span><i>°</i></b>
      <span>太阳高度</span>
    </div>
  </div>

  <p id="hint">拖动旋转 · 滚轮缩放 · 双击回正</p>
</div>

<aside id="deck" aria-label="渲染控制">
  <div class="deck-head">
    <h2>渲染控制</h2>
    <button id="reset" type="button" title="恢复到当前预设的初始参数">重置</button>
  </div>

  <div id="perf" aria-live="off">
    <span><b id="hud-fps">--</b> fps</span>
    <span><b id="hud-ms">--</b> ms</span>
    <span id="hud-tier">初始化</span>
  </div>

  <div id="presets" class="presets" role="group" aria-label="风格预设"></div>
  <div id="sections" class="sections"></div>
</aside>

<div id="loader">
  <div class="loader-inner">
    <span class="loader-word">体积云渲染</span>
    <p id="loader-text">正在初始化 WebGL2…</p>
    <div class="bar"><i id="loader-bar"></i></div>
  </div>
</div>

<div id="fatal" hidden></div>

/* ==================================================================
   天气图：CPU 端生成一张 512² 的可平铺纹理
   R = 云量    G = 云型 / 高度分布    B = 云底偏移    A = 细节扰动
   ================================================================== */

const WEATHER_SIZE = 512;

function weatherGen(size = WEATHER_SIZE) {
  const hash2i = (x, y, s) => {
    let h = Math.imul(x | 0, 374761393) ^ Math.imul(y | 0, 668265263) ^ Math.imul(s | 0, 1442695041);
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    h ^= h >>> 16;
    return (h >>> 0) / 4294967296;
  };

  const fade = (t) => t * t * (3 - 2 * t);

  // 可平铺 value noise：px∈[0,1)，freq 为该方向格子数（整数）
  const vnoise = (px, py, freq, seed) => {
    const x = px * freq;
    const y = py * freq;
    const ix = Math.floor(x);
    const iy = Math.floor(y);
    const fx = fade(x - ix);
    const fy = fade(y - iy);
    const x0 = ((ix % freq) + freq) % freq;
    const y0 = ((iy % freq) + freq) % freq;
    const x1 = (x0 + 1) % freq;
    const y1 = (y0 + 1) % freq;
    const a = hash2i(x0, y0, seed);
    const b = hash2i(x1, y0, seed);
    const c = hash2i(x0, y1, seed);
    const d = hash2i(x1, y1, seed);
    return a + (b - a) * fx + (c - a) * fy + (a - b - c + d) * fx * fy;
  };

  const fbm = (px, py, freq, octaves, seed) => {
    let sum = 0;
    let amp = 0.5;
    let norm = 0;
    let f = freq;
    for (let i = 0; i < octaves; i++) {
      sum += amp * vnoise(px, py, f, (seed + i * 131) | 0);
      norm += amp;
      amp *= 0.5;
      f *= 2;
    }
    return sum / norm;
  };

  const wrap01 = (v) => v - Math.floor(v);

  return function generateRow(y) {
    const py = (y + 0.5) / size;
    const row = new Uint8Array(size * 4);
    for (let x = 0; x < size; x++) {
      const px = (x + 0.5) / size;

      // domain warp：大尺度扭曲让云团轮廓不那么"圆"（保持可平铺）
      const wx = fbm(px, py, 4, 3, 11) - 0.5;
      const wy = fbm(px + 0.37, py + 0.11, 4, 3, 23) - 0.5;
      const qx = wrap01(px + wx * 0.26);
      const qy = wrap01(py + wy * 0.26);

      // R：云量 —— 两层 fbm 相乘出云街/云海
      const bank = fbm(qx, qy, 5, 4, 101);
      const detail = fbm(qx, qy, 13, 3, 211);
      let cov = bank * 0.7 + detail * 0.3;
      cov = Math.min(1, Math.max(0, (cov - 0.34) / 0.42));
      // 大尺度清空区（让某些区域露出天空）
      cov *= 0.35 + 0.9 * fbm(qx, qy, 2, 2, 301);

      // G：云型 + 高度分布
      const type = Math.min(1, Math.max(0, fbm(qx + 0.19, qy + 0.83, 3, 3, 401) * 1.35 - 0.15));
      // B：云底偏移
      const baseOff = Math.min(1, Math.max(0, fbm(qx + 0.61, qy + 0.29, 4, 2, 503) * 1.3 - 0.15));
      // A：细节扰动
      const grain = fbm(qx + 0.11, qy + 0.47, 16, 2, 607);
      const ero = Math.min(1, Math.max(0, 0.25 + 0.75 * fbm(qx + 0.9, qy + 0.15, 9, 3, 701)));

      const o = x * 4;
      row[o] = Math.round(Math.min(1, Math.max(0, cov)) * 255);
      row[o + 1] = Math.round(type * 255);
      row[o + 2] = Math.round(baseOff * 255);
      row[o + 3] = Math.round(Math.min(1, Math.max(0, grain * 0.6 + ero * 0.4)) * 255);
    }
    return row;
  };
}

// 分块生成，避免一次性阻塞主线程；每块之后让出 rAF 刷新进度条
function buildWeather(size = WEATHER_SIZE) {
  return new Promise((resolve) => {
    const gen = weatherGen(size);
    const data = new Uint8Array(size * size * 4);
    let y = 0;
    const BATCH = 24;
    const step = () => {
      const end = Math.min(size, y + BATCH);
      for (; y < end; y++) data.set(gen(y), y * size * 4);
      if (typeof window !== "undefined" && window.__weatherProgress) {
        window.__weatherProgress(y / size);
      }
      if (y < size) {
        requestAnimationFrame(step);
      } else {
        resolve({ size, data });
      }
    };
    step();
  });
}


/* ==================================================================
   体积云渲染 · GLSL 源码
   管线：噪声烘焙 → 场景 → 体积云(MRT) → TAA → 合成/风格化
   ================================================================== */

const GLSL_HEADER = `#version 300 es
`;

const GLSL_COMMON = `
precision highp float;
precision highp int;
precision highp sampler2D;
precision highp sampler3D;

const float PI = 3.14159265359;

float sat1(float x) { return clamp(x, 0.0, 1.0); }
vec3 sat3(vec3 v) { return clamp(v, 0.0, 1.0); }

float hash11(float p) {
  p = fract(p * 0.1031);
  p *= p + 33.33;
  p *= p + p;
  return fract(p);
}
float hash12(vec2 p) {
  vec3 p3 = fract(vec3(p.xyx) * 0.1031);
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.x + p3.y) * p3.z);
}
vec3 hash33(vec3 p) {
  p = fract(p * vec3(0.1031, 0.1030, 0.0973));
  p += dot(p, p.yxz + 33.33);
  return fract((p.xxy + p.yzz) * p.zyx);
}
float vnoise2(vec2 p) {
  vec2 i = floor(p), f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);
  float a = hash12(i);
  float b = hash12(i + vec2(1.0, 0.0));
  float c = hash12(i + vec2(0.0, 1.0));
  float d = hash12(i + vec2(1.0, 1.0));
  return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
}
float fbm2(vec2 p) {
  float v = 0.0;
  float a = 0.5;
  for (int i = 0; i < 4; i++) {
    v += a * vnoise2(p);
    p = p * 2.03 + 17.1;
    a *= 0.5;
  }
  return v;
}
// 模拟 ACES 的胶片响应
vec3 tonemapACES(vec3 x) {
  return clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0);
}
// Henyey-Greenstein 相函数
float hgPhase(float c, float g) {
  float g2 = g * g;
  return (1.0 - g2) / (4.0 * PI * pow(max(1.0 + g2 - 2.0 * g * c, 1e-4), 1.5));
}
`;

/* ---------------- 全屏大三角 ---------------- */
const VS_FULL = GLSL_HEADER + `
out vec2 vUV;
void main() {
  vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2)) * 2.0 - 1.0;
  vUV = p * 0.5 + 0.5;
  gl_Position = vec4(p, 0.0, 1.0);
}`;

/* ---------------- 1) 3D 噪声烘焙 ---------------- */
const FS_BAKE = GLSL_HEADER + GLSL_COMMON + `
uniform float uSize;
uniform float uLayer;
out vec4 o;

// 可平铺的梯度噪声：p 在 [0, period) 内
float perlin(vec3 p, float period) {
  vec3 i = floor(p);
  vec3 f = fract(p);
  vec3 u = f * f * (3.0 - 2.0 * f);
  float acc = 0.0;
  for (int dz = 0; dz < 2; dz++)
  for (int dy = 0; dy < 2; dy++)
  for (int dx = 0; dx < 2; dx++) {
    vec3 o3 = vec3(float(dx), float(dy), float(dz));
    vec3 cell = mod(i + o3, period);
    vec3 g = hash33(cell) * 2.0 - 1.0;
    vec3 d = f - o3;
    float w = (dx == 1 ? u.x : 1.0 - u.x)
            * (dy == 1 ? u.y : 1.0 - u.y)
            * (dz == 1 ? u.z : 1.0 - u.z);
    acc += w * dot(g, d);
  }
  return acc;
}

// 可平铺的 Worley 噪声（返回最近特征点距离，约 0..1）
float worley(vec3 p, float period) {
  vec3 i = floor(p);
  vec3 f = fract(p);
  float md = 8.0;
  for (int dz = -1; dz <= 1; dz++)
  for (int dy = -1; dy <= 1; dy++)
  for (int dx = -1; dx <= 1; dx++) {
    vec3 o3 = vec3(float(dx), float(dy), float(dz));
    vec3 cell = i + o3;
    vec3 jitter = hash33(mod(cell, period));
    vec3 fp = o3 + jitter - f;
    md = min(md, dot(fp, fp));
  }
  return sqrt(md);
}

void main() {
  vec3 pos = vec3(gl_FragCoord.xy / uSize, (uLayer + 0.5) / uSize);

  // R：大尺度 billow 形状 —— worley 团块 + perlin 内部起伏
  float w3 = 1.0 - sat1(worley(pos * 3.0, 3.0));
  float p4 = sat1(perlin(pos * 4.0, 4.0) * 0.62 + 0.5);
  p4 = smoothstep(0.22, 0.86, p4);
  float shape = mix(w3, 1.0, p4 * 0.82);

  // G / B / A：高频 worley 距离，用于侵蚀/边缘细节（距离越大越接近空洞）
  float w6 = sat1(worley(pos * 6.0, 6.0) * 1.28);
  float w12 = sat1(worley(pos * 12.0, 12.0) * 1.28);
  float g = smoothstep(0.10, 0.92, w6);
  float b = smoothstep(0.10, 0.92, w12);

  o = vec4(sat1(shape), g, b, mix(g, b, 0.45));
}`;

/* ---------------- 场景：天空 ---------------- */
const VS_SKY = VS_FULL;
const FS_SKY = GLSL_HEADER + GLSL_COMMON + `
uniform mat4 uInvVP;
uniform vec3 uCamPos;
uniform vec3 uSunDir;
uniform vec3 uSunColor;
uniform vec3 uZenith;
uniform vec3 uHorizon;
uniform vec3 uMountainColor;
uniform float uSunGlow;
uniform float uTime;
in vec2 vUV;
out vec4 o;

vec3 rayDir(vec2 uv) {
  vec4 p = uInvVP * vec4(uv * 2.0 - 1.0, 1.0, 1.0);
  return normalize(p.xyz / p.w - uCamPos);
}

float ridge(float az) {
  float v = 0.0;
  v += 0.52 * vnoise2(vec2(az * 1.8, 0.5));
  v += 0.31 * vnoise2(vec2(az * 4.3, 1.7));
  v += 0.17 * vnoise2(vec2(az * 9.7, 3.1));
  return v;
}

void main() {
  vec3 rd = rayDir(vUV);
  float y = clamp(rd.y, 0.0, 1.0);

  // 基础渐变：地平线偏亮，天顶偏深
  vec3 col = mix(uHorizon, uZenith, pow(y, 0.55));

  // 太阳：锐利本体 + 两圈光晕
  float sd = max(dot(rd, uSunDir), 0.0);
  float glow = pow(sd, 2200.0) * 6.0 + pow(sd, 120.0) * 0.30 + pow(sd, 8.0) * 0.04;
  col += uSunColor * glow * uSunGlow;

  // 地平线暖/冷带
  col += uHorizon * exp(-max(rd.y, 0.0) * 9.0) * 0.16;

  // 程序化远山剪影：远层偏灰、近层偏暗，形成空气透视与纵深
  float az = atan(rd.z, rd.x);
  float rFar = ridge(az * 0.55 + 11.0);
  float rNear = ridge(az * 0.92 + 3.0);

  float elevFar = mix(0.032, 0.088, rFar);
  float maskFar = 1.0 - smoothstep(elevFar - 0.004, elevFar + 0.003, rd.y);
  vec3 farCol = mix(uMountainColor, uHorizon, 0.55);
  farCol *= 0.93 + 0.14 * pow(max(dot(normalize(vec3(sin(az * 1.7), 0.3, cos(az * 1.7))), uSunDir), 0.0), 2.0);
  col = mix(col, farCol, maskFar * 0.9);

  float elevNear = mix(0.009, 0.048, rNear);
  float maskNear = 1.0 - smoothstep(elevNear - 0.003, elevNear + 0.003, rd.y);
  vec3 nearCol = mix(uMountainColor, uHorizon, 0.14);
  nearCol *= 0.86 + 0.2 * pow(max(dot(normalize(vec3(sin(az * 2.6), 0.42, cos(az * 2.6))), uSunDir), 0.0), 2.5);
  nearCol *= 0.94 + 0.1 * vnoise2(vec2(az * 30.0, rd.y * 160.0));
  col = mix(col, nearCol, maskNear);

  // 地平线处轻微压暗，避免过曝的白带
  col *= 1.0 - 0.10 * exp(-y * 30.0);
  o = vec4(col, 1.0);
}`;

/* ---------------- 场景：地面与建筑剪影 ---------------- */
const VS_GEO = GLSL_HEADER + GLSL_COMMON + `

const FS_GEO = GLSL_HEADER + GLSL_COMMON + `
uniform vec3 uSunDir;
uniform vec3 uSunColor;
uniform vec3 uAmbient;
uniform vec3 uHorizonColor;
uniform vec3 uBaseColor;
uniform vec3 uAltColor;
uniform float uKind; // 0 = 地面，1 = 建筑
uniform float uTime;

  vec3 hor = uHorizonColor * 0.18 * (1.0 - sat1(n.y));

/* ---------------- 2) 体积云光线步进 ---------------- */
const VS_CLOUD = VS_FULL;
const FS_CLOUD = GLSL_HEADER + GLSL_COMMON + `
uniform sampler3D uNoise;
uniform sampler2D uWeather;
uniform sampler2D uBlue;
uniform mat4 uInvVP;
uniform vec3 uCamPos;
uniform vec3 uSunDir;
uniform vec3 uSunColor;
uniform vec3 uAmbient;
uniform vec2 uResolution;
uniform float uTime;
uniform float uFrame;
uniform vec2 uBaseTop;       // x = 云底，y = 云顶
uniform float uCoverage;
uniform float uType;
uniform float uDensity;
uniform float uErosion;
uniform float uWind;
uniform float uNoiseScale;
uniform float uWeatherScale;
uniform float uBoxRadius;
uniform int uSteps;
uniform int uLightSteps;
uniform float uExtinction;

in vec2 vUV;
layout(location = 0) out vec4 oColor;
layout(location = 1) out vec2 oAux;

vec3 rayDir(vec2 uv) {
  vec4 p = uInvVP * vec4(uv * 2.0 - 1.0, 1.0, 1.0);
  return normalize(p.xyz / p.w - uCamPos);
}

vec4 weatherAt(vec3 p) {
  vec2 uv = p.xz * uWeatherScale + vec2(uTime * uWind * 0.0016, uTime * uWind * 0.0008);
  return textureLod(uWeather, uv, 0.0);
}

// h：0..1 高度比；cov：局部云量；w：天气图
float cloudDensity(vec3 p, float h, float cov, vec4 w, float detailMul) {
  // 云型：0 积云（厚实、底平顶鼓）→ 1 层云（扁平、薄）
  float t = sat1(uType * 0.85 + w.g * 0.35 - 0.1);
  float bottom = mix(0.02, 0.06, t);
  float topCut = mix(1.0, 0.62, t);
  float heightMask = smoothstep(bottom, bottom + 0.10, h) * (1.0 - smoothstep(topCut - 0.22, topCut, h));
  if (heightMask <= 0.001) return 0.0;

  // 竖直收窄：云底宽、云顶窄，形成塔状轮廓
  float covH = cov * mix(1.0, 0.60, sat1(h * 1.15));

  // 大尺度形状：3D perlin-worley，采样 LOD0 保细节
  vec3 sp = p * uNoiseScale + vec3(uTime * uWind * 0.006, 0.0, 0.0);
  float shape = textureLod(uNoise, sp, 0.0).r;
  float shape2 = textureLod(uNoise, sp * 2.3 + vec3(9.2, 4.7, 6.1), 0.0).r;
  shape = shape * 0.72 + shape2 * 0.28;

  // 硬阈值 → 清晰的云朵边界
  float thr = 1.0 - covH;
  float d = smoothstep(thr, min(thr + 0.10, 0.995), shape);

  // 侵蚀：高频 worley 在边缘啃出花椰菜状细节
  if (detailMul > 0.0) {
    vec3 dp = p * uNoiseScale * 4.5 + vec3(0.31, 0.17, 0.53);
    vec3 det = textureLod(uNoise, dp, 0.0).gba;
    float gap = dot(det, vec3(0.55, 0.30, 0.15));
    d = sat1(d - gap * uErosion * detailMul * 1.7 * smoothstep(0.04, 0.5, d));
  }

  d = sat1(d) * heightMask * uDensity;
  return d;
}

float lightMarch(vec3 p, float h, float cov, vec4 w) {
  float top = uBaseTop.y;
  float ds = clamp((top - p.y) / max(uSunDir.y, 0.16), 900.0, 4200.0) / float(uLightSteps);
  vec3 q = p;
  float tau = 0.0;
  for (int j = 0; j < uLightSteps; j++) {
    q += uSunDir * ds;
    float qh = (q.y - uBaseTop.x) / max(uBaseTop.y - uBaseTop.x, 1.0);
    if (qh > 1.0 || qh < 0.0) break;
    tau += cloudDensity(q, qh, cov, weatherAt(q), 0.0) * ds;
  }
  return exp(-tau * uExtinction);
}

void main() {
  vec3 rd = rayDir(vUV);

  // ---- 包围盒裁剪（一道减法）----
  float yMin = uBaseTop.x;
  float yMax = uBaseTop.y;
  vec3 inv = 1.0 / mix(vec3(1e-6), rd, step(vec3(1e-6), abs(rd)));
  vec3 tA = (vec3(-uBoxRadius, yMin, -uBoxRadius) - uCamPos) * inv;
  vec3 tB = (vec3(uBoxRadius, yMax, uBoxRadius) - uCamPos) * inv;
  vec3 tmin = min(tA, tB);
  vec3 tmax = max(tA, tB);
  float t0 = max(max(tmin.x, tmin.y), tmin.z);
  float t1 = min(min(tmax.x, tmax.y), tmax.z);
  t0 = max(t0, 0.0);

  if (t1 <= t0 || t1 <= 0.0) {
    oColor = vec4(0.0);
    oAux = vec2(1e9, 0.0);
    return;
  }

  // ---- 蓝噪声抖动起始偏移（二道减法：以少量步数换高频细节）----
  vec2 bnUV = gl_FragCoord.xy / 64.0 + vec2(0.618034 * uFrame, 0.381966 * uFrame);
  float dither = texture(uBlue, bnUV).r;

  float stepLen = (t1 - t0) / float(uSteps);
  float t = t0 + dither * stepLen;

  vec3 inscatter = vec3(0.0);
  float transmittance = 1.0;
  float meanDist = 0.0;
  float meanLit = 0.0;
  float accum = 0.0;

  float cosT = dot(rd, uSunDir);
  float phase = hgPhase(cosT, 0.72) * 0.72 + hgPhase(cosT, -0.22) * 0.28;

  for (int i = 0; i < uSteps; i++) {
    if (t > t1) break;
    vec3 p = uCamPos + rd * t;
    float h = (p.y - yMin) / max(yMax - yMin, 1.0);
    vec4 w = weatherAt(p);
    float cov = sat1(0.02 + w.r * uCoverage * 1.9);
    float d = cloudDensity(p, h, cov, w, 1.0);

    if (d > 0.002) {
      float lit = lightMarch(p, h, cov, w);
      // 双瓣相函数 + 多次散射近似 + powder
      float powder = 1.0 - exp(-d * 5.0);
      float litSoft = pow(lit, 0.30);
      vec3 sunLit = uSunColor * (lit * phase * 4.2 + litSoft * 0.42 + lit * lit * 0.14);
      sunLit *= mix(0.55, 1.0, powder);
      vec3 amb = uAmbient * 0.40 * (0.20 + 0.80 * litSoft) * mix(0.45, 1.0, h);
      vec3 Li = sunLit + amb;

      float ext = d * uExtinction;
      float tr = exp(-ext * stepLen);
      float wgt = (1.0 - tr) * transmittance;
      inscatter += Li * wgt;
      meanDist += t * wgt;
      meanLit += lit * wgt;
      accum += wgt;
      transmittance *= tr;
      if (transmittance < 0.015) break;
    }
    t += stepLen;
  }

  float alpha = 1.0 - transmittance;
  if (accum > 1e-4) {
    oAux = vec2(meanDist / accum, meanLit / accum);
  } else {
    oAux = vec2(1e9, 0.0);
  }
  oColor = vec4(inscatter, alpha);
}`;

/* ---------------- 3) 时间累积（TAA） ---------------- */
const VS_TAA = VS_FULL;
const FS_TAA = GLSL_HEADER + GLSL_COMMON + `
uniform sampler2D uCurrent;
uniform sampler2D uAux;
uniform sampler2D uHistory;
uniform mat4 uInvVP;
uniform mat4 uPrevVP;
uniform vec3 uCamPos;
uniform vec2 uResolution;
uniform float uBlend;
uniform float uHistoryValid;
uniform vec2 uDrift;
in vec2 vUV;
out vec4 o;

void main() {
  vec2 uv = gl_FragCoord.xy / uResolution;

  vec4 cur = texture(uCurrent, uv);
  vec2 aux = texture(uAux, uv).rg;

  // 3×3 邻域范围，抑制时域拖影
  vec3 mn = cur.rgb, mx = cur.rgb;
  float mnA = cur.a, mxA = cur.a;
  vec2 texel = 1.0 / uResolution;
  for (int y = -1; y <= 1; y++)
  for (int x = -1; x <= 1; x++) {
    vec4 c = texture(uCurrent, uv + vec2(float(x), float(y)) * texel);
    mn = min(mn, c.rgb);
    mx = max(mx, c.rgb);
    mnA = min(mnA, c.a);
    mxA = max(mxA, c.a);
  }

  vec4 hist = cur;
  float valid = 0.0;

  if (aux.x < 1e8 && uHistoryValid > 0.5) {
    // 用均值距离重建世界位置，再投影回上一帧
    vec4 farP = uInvVP * vec4(uv * 2.0 - 1.0, 1.0, 1.0);
    vec3 dir = normalize(farP.xyz / farP.w - uCamPos);
    vec3 world = uCamPos + dir * aux.x + vec3(uDrift.x, 0.0, uDrift.y);

    vec4 pc = uPrevVP * vec4(world, 1.0);
    vec2 puv = pc.xy / max(pc.w, 1e-4) * 0.5 + 0.5;
    bool inRange = puv.x > 0.002 && puv.x < 0.998 && puv.y > 0.002 && puv.y < 0.998;
    if (inRange && aux.x < 6.0e4) {
      hist = texture(uHistory, puv);
      valid = 1.0;
    }
  }

  hist.rgb = clamp(hist.rgb, mn, mx);
  hist.a = clamp(hist.a, mnA, mxA);

  float w = uBlend * valid;
  o = mix(cur, hist, w);
}`;

/* ---------------- 4) 合成 + 风格化 ---------------- */
const VS_COMPOSITE = VS_FULL;
const FS_COMPOSITE = GLSL_HEADER + GLSL_COMMON + `
uniform sampler2D uScene;
uniform sampler2D uSceneDepth;
uniform sampler2D uCloud;
uniform sampler2D uCloudAux;
uniform sampler2D uBlue;
uniform mat4 uInvVP;
uniform vec3 uCamPos;
uniform vec3 uSunDir;
uniform vec3 uSunColor;
uniform vec3 uAmbient;
uniform vec3 uFogColor;
uniform vec3 uShadowTint;
uniform vec3 uHighlightTint;
uniform vec3 uRimColor;
uniform vec2 uSunScreen;
uniform vec2 uResolution;
uniform float uNear;
uniform float uFar;
uniform float uTime;
uniform float uExposure;
uniform float uFogDensity;
uniform float uStylize;
uniform float uLevels;
uniform float uRim;
uniform float uSaturation;
uniform float uSceneSat;
uniform float uVignette;
in vec2 vUV;
out vec4 o;

vec3 rayDir(vec2 uv) {
  vec4 p = uInvVP * vec4(uv * 2.0 - 1.0, 1.0, 1.0);
  return normalize(p.xyz / p.w - uCamPos);
}

float viewDepth(float d) {
  // 非线性深度 → 沿视线的距离
  return (uNear * uFar) / (uFar - d * (uFar - uNear));
}

void main() {
  vec2 uv = vUV;
  vec3 dir = rayDir(uv);

  // ---- 场景 ----
  vec3 sceneCol = texture(uScene, uv).rgb;
  float sceneD = texture(uSceneDepth, uv).r;
  float sceneDist = viewDepth(min(sceneD, 0.99999));
  bool isSky = sceneD > 0.99999;

  // ---- 云：4 tap × 深度加权上采样（三道减法：半分辨率）----
  vec2 cs = 1.0 / uResolution;                 // 半分辨率纹素
  vec2 hp = uv / cs - 0.5;
  vec2 fl = fract(hp);
  vec2 base = (floor(hp) + 0.5) * cs;

  vec2 lo = vec2(0.0005);
  vec2 hi = vec2(0.9995);
  vec2 uv00 = clamp(base, lo, hi);
  vec2 uv10 = clamp(base + vec2(cs.x, 0.0), lo, hi);
  vec2 uv01 = clamp(base + vec2(0.0, cs.y), lo, hi);
  vec2 uv11 = clamp(base + cs, lo, hi);

  float d0 = viewDepth(sceneD);
  float e00 = abs(viewDepth(texture(uSceneDepth, uv00).r) - d0) / max(d0, 60.0);
  float e10 = abs(viewDepth(texture(uSceneDepth, uv10).r) - d0) / max(d0, 60.0);
  float e01 = abs(viewDepth(texture(uSceneDepth, uv01).r) - d0) / max(d0, 60.0);
  float e11 = abs(viewDepth(texture(uSceneDepth, uv11).r) - d0) / max(d0, 60.0);

  float k00 = (1.0 - fl.x) * (1.0 - fl.y) / (1.0 + e00 * e00 * 260.0);
  float k10 = fl.x * (1.0 - fl.y) / (1.0 + e10 * e10 * 260.0);
  float k01 = (1.0 - fl.x) * fl.y / (1.0 + e01 * e01 * 260.0);
  float k11 = fl.x * fl.y / (1.0 + e11 * e11 * 260.0);
  float wsum = k00 + k10 + k01 + k11;
  vec4 cl = (texture(uCloud, uv00) * k00 + texture(uCloud, uv10) * k10 +
             texture(uCloud, uv01) * k01 + texture(uCloud, uv11) * k11) / max(wsum, 1e-4);

  // 云距离（用于与地面做前后判定）
  float cloudDist = texture(uCloudAux, uv).x;

  float a = cl.a;
  vec3 cloudRGB = cl.rgb;

  // 场景与云的前后关系：云在场景之后则丢弃（贴地射线、遮挡物）
  if (!isSky && cloudDist > sceneDist + 40.0) {
    a = 0.0;
    cloudRGB = vec3(0.0);
  }

  // ---- 风格化：色阶化 + 双色阶调 + 边缘光 ----
  if (a > 0.0005) {
    vec3 avg = cloudRGB / a;
    float lum = dot(avg, vec3(0.2126, 0.7152, 0.0722));
    float lv = max(uLevels, 2.0);

    // 色阶量化（保留一点原始层次）
    float bf = sat1(lum * 1.15);
    float band = (floor(bf * lv) + 0.5) / lv;
    vec3 ramp = mix(uShadowTint, uHighlightTint, sat1(band));
    // 冷影暖光：按太阳方向的明暗略微偏移，避免死板
    ramp *= 0.82 + 0.36 * sat1(lum);

    vec3 styl = mix(avg, ramp, uStylize);

    // 屏幕空间 alpha 梯度 → 边缘光（勾在被太阳照亮的一侧）
    vec2 g = vec2(
      texture(uCloud, uv + vec2(cs.x, 0.0)).a - texture(uCloud, uv - vec2(cs.x, 0.0)).a,
      texture(uCloud, uv + vec2(0.0, cs.y)).a - texture(uCloud, uv - vec2(0.0, cs.y)).a
    );
    float edge = sat1(length(g) * 1.5);
    vec2 n2 = normalize(g + vec2(1e-4));
    float facing = sat1(dot(n2, normalize(uSunScreen)) * 0.5 + 0.5);
    float rimW = sat1(edge * uRim * mix(0.55, 1.0, facing) * 1.35);
    styl = mix(styl, uRimColor, rimW);

    cloudRGB = styl * a;
  } else {
    cloudRGB = vec3(0.0);
  }

  // ---- 雾（高度雾的近似：按视线距离）----
  float fogAmt = 0.0;
  if (!isSky) {
    fogAmt = 1.0 - exp(-sceneDist * uFogDensity);
    vec3 fogCol = uFogColor * (0.62 + 0.38 * max(dot(dir, uSunDir), 0.0));
    sceneCol = mix(sceneCol, fogCol, sat1(fogAmt));
  }

  // ---- 组合 ----
  vec3 col = sceneCol * (1.0 - a) + cloudRGB;

  // 曝光 + 饱和度（水墨预设把整场压成灰阶）
  col *= exp2(uExposure);
  float g0 = dot(col, vec3(0.2126, 0.7152, 0.0722));
  col = mix(vec3(g0), col, uSceneSat);
  col = mix(vec3(dot(col, vec3(0.2126, 0.7152, 0.0722))), col, uSaturation);

  // 色调映射
  col = tonemapACES(col);

  // 暗角
  float vig = smoothstep(1.25, 0.28, length((uv - 0.5) * vec2(1.0, 0.82)));
  col *= mix(1.0, vig, uVignette);

  // 胶片颗粒 + 蓝噪声抖动（去色带）
  float grain = hash12(gl_FragCoord.xy + vec2(uTime * 71.3, uTime * 37.7)) - 0.5;
  col += grain * 0.008;
  float ditherv = texture(uBlue, gl_FragCoord.xy / 64.0).r - 0.5;
  col += ditherv / 255.0;

  // gamma 编码
  col = pow(max(col, 0.0), vec3(1.0 / 2.2));
  o = vec4(col, 1.0);
}`;

  /* ================= 矩阵 ================= */
  const M4 = {
    perspective(out, fovy, aspect, near, far) {
      const f = 1 / Math.tan(fovy / 2);
      const nf = 1 / (near - far);
      out.fill(0);
      out[0] = f / aspect;
      out[5] = f;
      out[10] = (far + near) * nf;
      out[11] = -1;
      out[14] = 2 * far * near * nf;
      return out;
    },
    lookAt(out, eye, center, up) {
      let zx = eye[0] - center[0], zy = eye[1] - center[1], zz = eye[2] - center[2];
      let l = Math.hypot(zx, zy, zz) || 1;
      zx /= l; zy /= l; zz /= l;
      let xx = up[1] * zz - up[2] * zy;
      let xy = up[2] * zx - up[0] * zz;
      let xz = up[0] * zy - up[1] * zx;
      l = Math.hypot(xx, xy, xz) || 1;
      xx /= l; xy /= l; xz /= l;
      const yx = zy * xz - zz * xy;
      const yy = zz * xx - zx * xz;
      const yz = zx * xy - zy * xx;
      out[0] = xx; out[1] = yx; out[2] = zx; out[3] = 0;
      out[4] = xy; out[5] = yy; out[6] = zy; out[7] = 0;
      out[8] = xz; out[9] = yz; out[10] = zz; out[11] = 0;
      out[12] = -(xx * eye[0] + xy * eye[1] + xz * eye[2]);
      out[13] = -(yx * eye[0] + yy * eye[1] + yz * eye[2]);
      out[14] = -(zx * eye[0] + zy * eye[1] + zz * eye[2]);
      out[15] = 1;
      return out;
    },
    mul(out, a, b) {
      const o = new Float32Array(16);
      for (let c = 0; c < 4; c++) {
        for (let r = 0; r < 4; r++) {
          o[c * 4 + r] =
            a[0 * 4 + r] * b[c * 4 + 0] +
            a[1 * 4 + r] * b[c * 4 + 1] +
            a[2 * 4 + r] * b[c * 4 + 2] +
            a[3 * 4 + r] * b[c * 4 + 3];
        }
      }
      out.set(o);
      return out;
    },
    invert(out, a) {
      const a00 = a[0], a01 = a[1], a02 = a[2], a03 = a[3];
      const a10 = a[4], a11 = a[5], a12 = a[6], a13 = a[7];
      const a20 = a[8], a21 = a[9], a22 = a[10], a23 = a[11];
      const a30 = a[12], a31 = a[13], a32 = a[14], a33 = a[15];
      const b00 = a00 * a11 - a01 * a10;
      const b01 = a00 * a12 - a02 * a10;
      const b02 = a00 * a13 - a03 * a10;
      const b03 = a01 * a12 - a02 * a11;
      const b04 = a01 * a13 - a03 * a11;
      const b05 = a02 * a13 - a03 * a12;
      const b06 = a20 * a31 - a21 * a30;
      const b07 = a20 * a32 - a22 * a30;
      const b08 = a20 * a33 - a23 * a30;
      const b09 = a21 * a32 - a22 * a31;
      const b10 = a21 * a33 - a23 * a31;
      const b11 = a22 * a33 - a23 * a32;
      let det = b00 * b11 - b01 * b10 + b02 * b09 + b03 * b08 - b04 * b07 + b05 * b06;
      if (!det) return out;
      det = 1 / det;
      out[0] = (a11 * b11 - a12 * b10 + a13 * b09) * det;
      out[1] = (a02 * b10 - a01 * b11 - a03 * b09) * det;
      out[2] = (a31 * b05 - a32 * b04 + a33 * b03) * det;
      out[3] = (a22 * b04 - a21 * b05 - a23 * b03) * det;
      out[4] = (a12 * b08 - a10 * b11 - a13 * b07) * det;
      out[5] = (a00 * b11 - a02 * b08 + a03 * b07) * det;
      out[6] = (a32 * b02 - a30 * b05 - a33 * b01) * det;
      out[7] = (a20 * b05 - a22 * b02 + a23 * b01) * det;
      out[8] = (a10 * b10 - a11 * b08 + a13 * b06) * det;
      out[9] = (a01 * b08 - a00 * b10 - a03 * b06) * det;
      out[10] = (a30 * b04 - a31 * b02 + a33 * b00) * det;
      out[11] = (a21 * b02 - a20 * b04 - a23 * b00) * det;
      out[12] = (a11 * b07 - a10 * b09 - a12 * b06) * det;
      out[13] = (a00 * b09 - a01 * b07 + a02 * b06) * det;
      out[14] = (a31 * b01 - a30 * b03 - a32 * b00) * det;
      out[15] = (a20 * b03 - a21 * b01 + a22 * b00) * det;
      return out;
    },
    fromTRS(out, tx, ty, tz, ry, sx, sy, sz) {
      const c = Math.cos(ry), s = Math.sin(ry);
      out[0] = c * sx; out[1] = 0; out[2] = -s * sx; out[3] = 0;
      out[4] = 0; out[5] = sy; out[6] = 0; out[7] = 0;
      out[8] = s * sz; out[9] = 0; out[10] = c * sz; out[11] = 0;
      out[12] = tx; out[13] = ty; out[14] = tz; out[15] = 1;
      return out;
    },
  };
