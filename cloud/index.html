<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CLOUD LAB · 前端体积云实验室</title>
<style>
  :root {
    --bg: #0b0e12;
    --panel: rgba(14, 18, 24, 0.82);
    --line: rgba(255, 255, 255, 0.08);
    --ink: #e8edf3;
    --muted: #8b98a8;
    --accent: #7fd3c0;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font: 12px/1.5 "Manrope", "Segoe UI", system-ui, sans-serif; overflow: hidden; }
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  .hud { position: fixed; z-index: 5; }
  .hud--tl { top: 16px; left: 16px; }
  .hud--tr { top: 16px; right: 16px; text-align: right; }

  .brand { font-size: 11px; letter-spacing: .28em; color: var(--muted); }
  .brand b { color: var(--ink); font-weight: 600; }
  .stats { margin-top: 6px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .stats span { color: var(--accent); }

  .panel {
    position: fixed; top: 16px; right: 16px; width: 286px; max-height: calc(100vh - 32px);
    overflow-y: auto; background: var(--panel); backdrop-filter: blur(14px);
    border: 1px solid var(--line); border-radius: 12px; padding: 14px 14px 16px;
    z-index: 6;
  }
  .panel h1 { margin: 0 0 12px; font-size: 11px; letter-spacing: .24em; color: var(--muted); font-weight: 500; }
  .row { margin-bottom: 10px; }
  .row__head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
  .row__head label { color: var(--muted); letter-spacing: .06em; }
  .row__head output { color: var(--ink); font-variant-numeric: tabular-nums; }
  input[type=range] { -webkit-appearance: none; width: 100%; height: 3px; border-radius: 3px;
    background: rgba(255,255,255,.14); outline: none; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 11px; height: 11px;
    border-radius: 50%; background: var(--accent); cursor: pointer; box-shadow: 0 0 0 3px rgba(127,211,192,.15); }
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 12px 0 10px; }
  .seg button, .actions button {
    appearance: none; border: 1px solid var(--line); background: rgba(255,255,255,.03);
    color: var(--ink); border-radius: 7px; padding: 7px 6px; cursor: pointer; font: inherit;
    letter-spacing: .06em; transition: background .15s, border-color .15s;
  }
  .seg button:hover, .actions button:hover { background: rgba(255,255,255,.07); }
  .seg button.is-on { border-color: var(--accent); color: var(--accent); background: rgba(127,211,192,.08); }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .check { display: flex; align-items: center; gap: 8px; margin: 10px 0 2px; color: var(--muted); cursor: pointer; }
  .check input { accent-color: var(--accent); }
  .hint { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); color: var(--muted); font-size: 11px; }
  .hint b { color: var(--ink); font-weight: 500; }
  #err { position: fixed; inset: 0; display: none; place-items: center; z-index: 20;
    background: #0b0e12; color: #ff9c9c; font: 13px/1.6 ui-monospace, monospace; padding: 40px; white-space: pre-wrap; }
</style>
</head>
<body>
<canvas id="stage"></canvas>

<div class="hud hud--tl">
  <div class="brand">CLOUD <b>LAB</b> · 体积云实验室 v2</div>
  <div class="stats">frame <span id="ms">--</span> · <span id="res">--</span> · march <span id="stepStat">--</span></div>
  <div class="stats">预步进 跳过 <span id="skipInfo">--</span> · 累积 <span id="accInfo">--</span> · <span id="autoInfo">AUTO</span></div>
</div>

<aside class="panel" id="panel">
  <h1>SHAPE</h1>

  <div class="row"><div class="row__head"><label>COVERAGE</label><output id="oCoverage">0.44</output></div>
    <input id="coverage" type="range" min="0" max="1" step="0.01" value="0.44" /></div>

  <div class="row"><div class="row__head"><label>CLOUD TYPE</label><output id="oType">1.00</output></div>
    <input id="type" type="range" min="0" max="2" step="0.01" value="1" /></div>

  <div class="row"><div class="row__head"><label>DENSITY</label><output id="oDensity">1.20</output></div>
    <input id="density" type="range" min="0.1" max="3" step="0.05" value="1.2" /></div>

  <div class="row"><div class="row__head"><label>DETAIL EROSION</label><output id="oDetail">0.60</output></div>
    <input id="detail" type="range" min="0" max="1" step="0.01" value="0.6" /></div>

  <div class="row"><div class="row__head"><label>CLOUD BASE</label><output id="oBase">1400</output></div>
    <input id="base" type="range" min="400" max="4000" step="50" value="1400" /></div>

  <div class="row"><div class="row__head"><label>CLOUD TOP</label><output id="oTop">3200</output></div>
    <input id="top" type="range" min="800" max="9000" step="50" value="3200" /></div>

  <h1 style="margin-top:16px">LIGHT</h1>

  <div class="row"><div class="row__head"><label>MS CONTRIBUTION</label><output id="oMsC">0.55</output></div>
    <input id="msContrib" type="range" min="0" max="0.95" step="0.01" value="0.55" /></div>

  <div class="row"><div class="row__head"><label>MS OCCLUSION</label><output id="oMsO">0.55</output></div>
    <input id="msOccl" type="range" min="0.1" max="1" step="0.01" value="0.55" /></div>

  <div class="row"><div class="row__head"><label>POWDER</label><output id="oPowder">1.00</output></div>
    <input id="powder" type="range" min="0" max="1" step="0.01" value="1" /></div>

  <div class="row"><div class="row__head"><label>SUN ELEV</label><output id="oSunEl">32</output></div>
    <input id="sunEl" type="range" min="-4" max="80" step="1" value="32" /></div>

  <div class="row"><div class="row__head"><label>SUN AZIM</label><output id="oSunAz">24</output></div>
    <input id="sunAz" type="range" min="0" max="360" step="1" value="24" /></div>

  <h1 style="margin-top:16px">BUDGET</h1>

  <div class="row"><div class="row__head"><label>MARCH STEPS</label><output id="oSteps">56</output></div>
    <input id="steps" type="range" min="16" max="160" step="4" value="56" /></div>

  <div class="row"><div class="row__head"><label>LIGHT STEPS</label><output id="oLight">5</output></div>
    <input id="light" type="range" min="1" max="10" step="1" value="5" /></div>

  <div class="row"><div class="row__head"><label>RENDER SCALE</label><output id="oScale">0.70</output></div>
    <input id="scale" type="range" min="0.3" max="1" step="0.05" value="0.7" /></div>

  <div class="row"><div class="row__head"><label>WIND m/s</label><output id="oWind">18</output></div>
    <input id="wind" type="range" min="0" max="120" step="1" value="18" /></div>

  <div class="row"><div class="row__head"><label>AERIAL DENSITY</label><output id="oHaze">1.00</output></div>
    <input id="haze" type="range" min="0" max="4" step="0.05" value="1" /></div>

  <div class="seg">
    <button data-preset="cumulus" class="is-on">CUMULUS</button>
    <button data-preset="stratus">STRATUS</button>
    <button data-preset="storm">STORM</button>
  </div>

  <label class="check"><input id="accumulate" type="checkbox" checked /> 时间累积 (TAA)</label>
  <label class="check"><input id="autoBudget" type="checkbox" checked /> 自动性能预算</label>
  <label class="check"><input id="aerial" type="checkbox" checked /> 空气透视</label>

  <div class="actions">
    <button id="pause">PAUSE</button>
    <button id="reset">RESET</button>
  </div>

  <p class="hint">
    拖动画面看云，滚轮拉近。<b>DEBUG</b>：<span id="dbgBtns"></span>
    <br>2 = 密度统计 · 3 = 空气透视开关对比 · 6 = 实际步数（越黑说明空域跳过越有效）
  </p>
</aside>

<script id="vs" type="x-shader/x-vertex">
#version 300 es
precision highp float;
void main(){
  vec2 p = vec2((gl_VertexID << 1) & 2, gl_VertexID & 2);
  gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
}
</script>

<script id="fsCloud" type="x-shader/x-fragment">
#version 300 es
precision highp float;
precision highp sampler3D;
out vec4 fragColor;

// >>> CLOUD-KERNEL:BEGIN
/* ===========================================================================
   CLOUD-KERNEL v2  ·  前端「灵活体积云」唯一真相来源
   ---------------------------------------------------------------------------
   由 _lab/tools/sync-kernel.mjs 注入到 lab 与 ship 的 CLOUD-KERNEL 标记区。
   不要直接编辑注入后的副本。

   理论骨架（参数化 / 可分级的近似映射）：
     密度   = 高度剖面(云型) × 天气覆盖(艺术输入) × 形状噪声 × 细节噪声
     光照   = 单次散射 + 4 阶指数和多重散射近似（贡献度 A / 遮蔽度 B 两个旋钮）
     积分   = 粗探针预步进（低分辨率探针 → 只在非空区加密采样）
              + 距离自适应步长 + 预算自适应 + 提前跳出
     介质   = Beer-Lambert 消光 + Henyey-Greenstein 双叶相位函数

   宿主负责：#version / precision / out 变量 / main()。
   本文件负责：全部 uniform 声明（宿主不得重复声明）。
   =========================================================================== */

uniform vec2  uRes;
uniform float uTime;
uniform float uJitter;
uniform vec3  uCamPos;
uniform mat3  uCamBasis;
uniform float uFovTan;
uniform float uAspect;

uniform sampler3D uNoise;
uniform sampler3D uWorley;
uniform float uNoiseLo,  uNoiseHi;
uniform float uWorleyLo, uWorleyHi;

uniform vec2  uSeedXZ;      // 噪声域偏移：把「哪朵云在你头顶」变成艺术参数
uniform float uCoverage;    // 0..1  天空被覆盖的比例（艺术输入）
uniform float uType;        // 0 层云 .. 1 积云 .. 2 积雨云
uniform float uDensityMul;  // 密度倍率
uniform float uDetail;      // 0..1 细节噪声振幅
uniform float uBase, uTop;  // 云底 / 云顶海拔（米）
uniform float uMaxDist;     // 最远追踪距离（米）
uniform float uWind;        // 漂移速度 m/s

uniform vec3  uSunDir;      // 指向太阳的单位向量
uniform vec3  uSunColor;    // 太阳辐亮度（含艺术增益，宿主负责量级）
uniform vec3  uSkyTop, uSkyHorizon, uHazeColor;
uniform float uSkyScale;    // 天空/环境光整体缩放（昼夜）

uniform float uAerial, uAerialK;   // 空气透视开关 / 密度 1/m
uniform float uMSContrib;          // 多重散射「贡献度」 A
uniform float uMSOccl;             // 多重散射「遮蔽度」 B
uniform float uPowder;             // 粉化（边缘透光）强度
uniform float uPhaseG, uPhaseMix;  // HG 双叶参数
uniform float uAmbScale;           // 环境光倍率

uniform int   uSteps, uLightSteps;
uniform float uStoreLdr;
uniform float uDebug;

const float PI      = 3.14159265359;
const float R_EARTH = 6371000.0;
const float EXT_PER_DENSITY = 0.0012;   // 归一化密度 1.0 对应的消光系数 (1/m)

/* ── 光照标定（这三条是按我们的 σe 量级实测标出来的，别照抄参考实现的数值）──
   SUN_GAIN : 参考实现的太阳辐亮度是物理量级（HDR 几十~几百）；我们的 uSunColor
              只有 11，多重散射归一后又只剩 ~0.1，实测云体比天空还暗。这里补艺术增益。
   SKY_AMB  : 天空色是「辐照度」，进云要转成辐亮度。参考用 1/4π≈0.08（它有色度 LUT），
              我们的 palette 不是物理量，实测 0.08 让暗面死黑、云和背景同色 → 用 0.30。
   POWDER_LEN: 参考的 exp(-σe·150) 是它自己的消光量级（σe≈0.01/m）。我们 σe≈0.0012/m，
              同一数值会把整片云乘掉 70%（实测 0.11）→ 长度尺度放大到 1000 m。        */
const float SUN_GAIN    = 4.0;
const float SKY_AMB     = 0.30;
const float POWDER_LEN  = 1000.0;
/* 密度底噪门限：低于它的密度一律当空气。腐蚀算子的连续尾巴会在平视时
   累积成满屏白絮（用户报的"云朵间隙模糊散落"）。0.10 = 吃掉最稀的 10%。 */
const float DENSITY_FLOOR = 0.10;

/* ── 去规整化：频段分离 + 两层域扭曲（2026-10-20）────────────────────────
   旧做法天气场和形状场都用 0.00030 采样同一张 64³ 平铺纹理：单一 3.3 km 周期，
   20 km 视距内精确复读约 6 次，俯视就是一张规则网格（证据：
   _lab/cloud/shots/look-base/top-dbg2.png 与 look-after/top-dbg2.png）。

   两条一起改：
   1) **频段分离**：天气 / 形状 / 两层扭曲分别用 30 / 37 / 19 / 23 ×1e-5。
      纹理本身是无缝平铺的（Perlin 生成时按整数周期 wrap，见宿主 buildNoise），
      所以任何频率都不会出新接缝；而四个互质整数频率的**联合周期 = 1e5 m = 100 km**
      （T 必须同时是 1e5/30、1e5/37、1e5/19、1e5/23 的整数倍，最小解 T=1e5）。
      20 km 视距只走到 1/5 个周期，不再整块复读。**不要**把某个频段改成
      非整数 ×1e-5（例如 30.5），那会让联合周期塌回几十公里以内，重复感回来。
   2) **两层域扭曲**：每层一个低频噪声标量，各自不同 offset、不同频率，
      合计把采样位置最多推开 ±0.9 km/轴（约 0.5 个天气特征尺寸），Perlin 的
      轴向格子被揉成有机分布。扭曲场自己的频率（19/23）与天气（30）不同，
      于是「天气 ∘ 扭曲」的联合周期也是 100 km —— 只改频段不加扭曲，
      天气覆盖的空洞仍会按 3.3 km 的节奏排队；只加扭曲不改频段，
      扭曲场和天气同周期时复读也还在。两件事必须一起做。            */
const vec2  W_OFF   = vec2(0.137, 0.571);   // 天气场 offset
const vec2  S_OFF   = vec2(0.619, 0.233);   // 形状场 offset（与天气错开，避免同相）
const vec2  W1_OFF  = vec2(0.317, 0.811);   // 域扭曲第 1 层 offset
const vec2  W2_OFF  = vec2(0.743, 0.129);   // 域扭曲第 2 层 offset
const float W_SCALE  = 0.00030;             // 30e-5  天气场
const float S_SCALE  = 0.00037;             // 37e-5  形状场
const float W1_SCALE = 0.00019;             // 19e-5  扭曲层 1
const float W2_SCALE = 0.00023;             // 23e-5  扭曲层 2
const float WARP_AMP = 1800.0;              // 米：每轴 ±0.9 km（两层各 (n-0.5)*1800）

/* 两层域扭曲：返回世界空间 XZ 位移（米）+ 第 2 层的原始值（z 分量，
   给覆盖度当大尺度晴/云分区用）。两个标量各推一个轴。 */
vec3 domainWarp(vec3 q){
  float a = texture(uNoise, vec3(q.xz * W1_SCALE + W1_OFF, 0.211)).r;
  float b = texture(uNoise, vec3(q.xz * W2_SCALE + W2_OFF, 0.733)).r;
  return vec3((vec2(a, b) - 0.5) * WARP_AMP, b);
}

/* 调试输出（lab 用，ship 忽略） */
float gDbgShape, gDbgCover, gDbgBody, gDbgSteps, gDbgSkips;

float hash12(vec2 p){
  vec3 p3 = fract(vec3(p.xyx) * 0.1031);
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.x + p3.y) * p3.z);
}

vec2 raySphere(vec3 ro, vec3 rd, float r){
  vec3 oc = ro - vec3(0.0, -R_EARTH, 0.0);
  float b = dot(oc, rd);
  float c = dot(oc, oc) - r * r;
  float h = b * b - c;
  if (h < 0.0) return vec2(-1.0, -1.0);
  h = sqrt(h);
  return vec2(-b - h, -b + h);
}

/* 把噪声重标定到 0..1：数组的 p5/p95 由 CPU 侧实测传入，阈值因此可以跨噪声设置复现 */
float nrm(float v, float lo, float hi){
  return clamp((v - lo) / max(hi - lo, 1e-5), 0.0, 1.0);
}

/* ── 高度剖面：同一条公式派生三种云型 ──────────────────────────────────────
   层云 = 薄的均匀板；积云 = 圆顶；积雨云 = 塔状 + 顶部砧状展开。            */
float heightProfile(float h, float type){
  float bot   = smoothstep(0.0, 0.055, h);
  float slab  = 1.0 - smoothstep(0.45, 0.92, h);
  float dome  = 1.0 - smoothstep(0.26, 0.78, h);
  float tower = 1.0 - smoothstep(0.50, 0.90, h);
  float lo = mix(slab, dome, clamp(type, 0.0, 1.0));
  float hi = mix(dome, tower, clamp(type - 1.0, 0.0, 1.0));
  float p  = mix(lo, hi, step(1.0, type));
  float anvil = smoothstep(0.62, 0.97, h) * (1.0 - smoothstep(0.975, 1.0, h));
  p = max(p, anvil * clamp(type - 1.0, 0.0, 1.0));
  return bot * clamp(p, 0.0, 1.0);
}

/* 线性重映射（参考实现的 remapClamped）。整条密度链只用这个，不用 smoothstep 阈值。 */
float remap01(float v, float lo, float hi){
  return clamp((v - lo) / max(hi - lo, 1e-5), 0.0, 1.0);
}

float hgPhase(float c, float g){
  float g2 = g * g;
  return (1.0 - g2) / (4.0 * PI * pow(max(1.0 + g2 - 2.0 * g * c, 1e-4), 1.5));
}
/* 双叶 HG 的凸组合：权重和为 1，所以整个球面的积分仍然守恒 */
float phaseFn(float mu){
  float g = uPhaseG;
  float m = clamp(uPhaseMix * 0.5 + 0.5, 0.0, 1.0);
  return mix(hgPhase(mu, g), hgPhase(mu, -g * 0.45), m);
}

/* ── 密度 v3 ───────────────────────────────────────────────────────────────
   把旧的「5 路噪声加权和 + smoothstep(0.40,0.56) 绝对阈值」换成
   「覆盖度软斜坡 + 腐蚀算子」。为什么这决定了有没有体积感
   （见 _wip/NOTES-takram-shader-distill.md §2.3）：

     1. 腐蚀而不是乘法：density = remap(density, (1-shape)*amount, 1)
        —— 云的**表面**变成 shape 噪声的等值面；shape 高则阈值低、该处保留，
        shape 低则被"啃掉"。乘法只改体内部亮度，把表面温度写死成某个常数，
        于是任何视角下都是同一层壳 → 平板感。
     2. 没有绝对阈值：全链只有线性斜坡，云内密度连续 0→1。
        二值化的色块没有内部梯度，光打上去只剩一个平色。
     3. 竖向半圆偏置 hs = 1-x²：云在底/顶收窄，这是积云轮廓的来源。
     4. 双尺度：shape 3.3 km（大菜花）+ Worley 167 m（小绒球）两级腐蚀。

   高度剖面 prof 放最前面：为 0 的空域直接 return，省掉 4 次 3D 采样。      */
float cloudDensityW(vec3 p, vec3 wq, out float h01){
  h01 = (p.y - uBase) / max(uTop - uBase, 1.0);
  float hf = clamp(h01, 0.0, 1.0);
  float prof = heightProfile(hf, uType);
  if (prof <= 5e-4) return 0.0;

  vec3 q = p + vec3(uSeedXZ.x, 0.0, uSeedXZ.y) - vec3(uWind, 0.0, uWind * 0.35) * uTime;

  /* ── 1. 天气 → 覆盖度：宽 0.6 的软斜坡，factor 随高度做半圆偏置 ──
     关键：先把天气往「满覆盖」拉 60%（参考实现的 mix(localWeather,1,covFilterWidth)），
     再在 [factor, factor+0.6] 上做线性斜坡。少了这一步，coverage=0.44 实际只覆盖
     约 10% 天空，云会退化成地平线上的几个小点（实测：p1-v3）。

     尺度：天气场原来是 16 km 周期 —— 从地面平视时，一朵云就占满整个视野，
     数不出独立云团，看上去必然是一面墙。改成 3.3 km 周期（主导特征约 1~2 km），
     20 km 外一眼能看到 5~10 朵分开的积云，中间露出天空。                     */
  /* 域扭曲后的采样位置：天气 / 形状用不同的频率与 offset（周期 100 km，见文件顶部）。
     wq 由调用方传入，主 march 每步算一次，光照步复用命中点的那一个。 */
  vec3 qw = q + vec3(wq.x, 0.0, wq.y);

  float weather = nrm(texture(uNoise, vec3(qw.xz * W_SCALE + W_OFF, 0.37)).r, uNoiseLo, uNoiseHi);
  float cov  = clamp(uCoverage, 0.0, 1.0);
  float xh   = clamp(pow(hf, 0.35) * 2.0 - 1.0, -1.0, 1.0);
  float hs   = 1.0 - xh * xh;
  float factor = 1.0 - cov * hs;
  /* 大尺度晴/云分区（5.3 km 尺度）。
     这里修掉一个结构性 bug：旧写法 mix(weather,1,0.60) 的下限是 0.60，
     而 factor 在中高度只有 1-cov≈0.56 → occ 永远 >0，天中间任何地方都有云，
     云场只能是一层铺满的「爆米花」。现在晴区最低只 mix 到 0.10，
     低于 factor → 真·零覆盖，团与团之间才露出天空。 */
  float big  = smoothstep(0.20, 0.62, wq.z);
  float fill = mix(0.10, 0.52, big);
  float occ  = remap01(mix(weather, 1.0, fill), factor, factor + 0.50);
  if (occ <= 5e-4) return 0.0;

  /* ── 2. 形状腐蚀：37e-5 频率（FBM 4 octave，最细约 110 m）── */
  float shape = nrm(texture(uNoise, vec3(qw.xz * S_SCALE + S_OFF, q.y * S_SCALE)).r, uNoiseLo, uNoiseHi);
  float amt   = mix(0.42, 0.80, clamp(uDetail, 0.0, 1.0));
  float d     = remap01(occ, (1.0 - shape) * amt, 1.0);

  /* ── 3. 细节腐蚀：Worley 胞约 167 m。顶部 = 圆润蓬松，底部 = 缕状撕边 ── */
  float det = nrm(texture(uWorley, q * 0.00120).r, uWorleyLo, uWorleyHi);
  float mod = mix(pow(det, 6.0), 1.0 - det, smoothstep(0.20, 0.40, hf));
  d = remap01(d * 2.0, mod * 0.5, 1.0);

  /* ── 4. 高度剖面 + 上密下疏 ── */
  d *= prof;
  d *= 0.25 + 0.75 * hf;

  /* ── 5. 密度底噪门限（DENSITY_FLOOR）──────────────────────────────────────
     腐蚀算子是连续的，所以凡是「刚过阈值」的地方都会留下 1%~8% 的密度尾巴。
     平视时这些尾巴沿视线累积成一整片发白的薄雾 —— 用户报的
     「云朵间隙有模糊散落、很丑」就是它（实测：覆盖率 0.21 时整片天空都是白絮）。
     低于门限一律当空气：云有干净的轮廓，云间隙是真的天空。               */
  d = remap01(d, DENSITY_FLOOR, 1.0);

  gDbgShape = shape; gDbgCover = occ; gDbgBody = d;
  return d * uDensityMul;
}

/* 通用入口：自己算扭曲向量 */
float cloudDensity(vec3 p, out float h01){ return cloudDensityW(p, domainWarp(p), h01); }

/* 只算密度的光照版：复用命中点的扭曲向量。太阳方向一次穿 2.3 km 云层，
   而扭曲场的变化尺度是 4~5 km，所以沿这条光程用同一个 wq 误差在噪声内，
   换来的是每次命中少 2*uLightSteps 次纹理采样。 */
float densityLite(vec3 p, vec3 wq){ float h; return cloudDensityW(p, wq, h); }

/* ── 多重散射：Kulla-Conty 指数和，8 阶 ────────────────────────────────────
   每一阶同时衰减三样东西，比例都是 0.5^i：
     beer  = exp(-tau * 0.5^i)      ← 散射一次后剩余光程更短
     能量  × 0.5^i
     相位各向异性 g × 0.5^i         ← 越往高阶越接近各向同性
   第 0 阶就是纯单次散射；tau=0 时归一化回平均相位，不凭空造能量。
   旧的固定 4 阶 + 两个独立旋钮做不到「相位也一起塌缩」，背光面因此发灰。   */
float multiScatter(float tau, float mu, out float ambOcc){
  float g = clamp(uPhaseG, 0.0, 0.95);
  float m = clamp(uPhaseMix * 0.5 + 0.5, 0.0, 1.0);
  float sum = 0.0, norm = 0.0, w = 1.0, e = 1.0, gs = g;
  for (int o = 0; o < 8; o++){
    float ph = mix(hgPhase(mu, gs), hgPhase(mu, -gs * 0.45), m);
    sum  += w * exp(-e * tau) * ph;
    norm += w;
    w *= 0.5; e *= 0.5; gs *= 0.5;
  }
  /* 云内部的环境光被自身遮蔽：光学厚度越大，天光进得越少 → 顶亮底暗 */
  ambOcc = exp(-tau * 0.30);
  return sum / max(norm, 1e-4);
}

/* 沿太阳方向积分光学厚度（Beer-Lambert）。空域提前跳出。 */
float lightTau(vec3 p, vec3 wq, float sigmaE, int n){
  float ls = max((uTop - uBase) / float(n), 40.0);
  float tau = 0.0;
  for (int j = 0; j < 16; j++){
    if (j >= n) break;
    vec3 lp = p + uSunDir * (float(j) + 0.5) * ls;
    if (lp.y < uBase - 300.0) break;
    tau += densityLite(lp, wq) * ls * sigmaE;
  }
  return tau;
}

/* ── 主追踪 ────────────────────────────────────────────────────────────────
   返回 vec4(预乘内散射 rgb, 透射率 a)。

   采样 v3 —— 透视几何步长：
     dt 从 dt0 起按 R 增长；dt0 由「几何级数求和恰好铺满 [t0,t1]」反解，
     并夹到 ≥45 m。于是同样 n 个样本覆盖整条射线，近处 45~100 m / 远处数百米，
     而不是旧方案「990 m 探针格 + 格内 3~5 刀」的常数密度切片。

   抖动：每帧每像素一个偏移，作用于**首步**（整条射线一起滑）。
     步边界逐帧稳定 → 时间累积不会糊；累积把首步的阶梯收敛掉。
   ------------------------------------------------------------------------ */
vec4 marchClouds(vec3 ro, vec3 rd, out float outDist){
  outDist = 0.0;
  float trans = 1.0;
  vec3 acc = vec3(0.0);
  gDbgSteps = 0.0; gDbgSkips = 0.0;

  /* 只有「相机在云底之下 + 向下看」才必然无云；相机在云层之上时向下看应该看得见云 */
  if (rd.y <= 0.0 && ro.y < uBase) return vec4(acc, trans);

  vec2 outer = raySphere(ro, rd, R_EARTH + uTop);
  if (outer.y < 0.0) return vec4(acc, trans);
  float t0 = max(outer.x, 0.0);
  float t1 = min(outer.y, t0 + uMaxDist);

  /* 云区 = 在云顶球之内、且在云底球之外。相机在云底之下时射线「先出云底球」，
     相机在云层之上时射线「先进云底球」——两种情形切法相反。 */
  float rIn = R_EARTH + uBase;
  float dc  = length(ro - vec3(0.0, -R_EARTH, 0.0));
  vec2 inner = raySphere(ro, rd, rIn);
  if (dc < rIn) {
    if (inner.y > t0) t0 = max(t0, inner.y);
  } else if (inner.x > 0.0) {
    t1 = min(t1, inner.x);
  }
  if (t1 <= t0) return vec4(acc, trans);

  float span   = t1 - t0;
  float shell  = max(uTop - uBase, 1.0);
  float sigmaE = EXT_PER_DENSITY * uDensityMul;
  float mu     = dot(rd, uSunDir);
  vec3  haze   = uHazeColor * (0.72 + 0.28 * clamp(uSunDir.y * 3.0, 0.0, 1.0));

  int n = clamp(uSteps, 8, 192);
  const float R = 1.02;
  float dt = span * (R - 1.0) / max(pow(R, float(n)) - 1.0, 1e-4);
  dt = clamp(dt, 45.0, 400.0);

  /* 每帧/每像素的射线抖动：整条射线在第一个步长内滑动（只抖首步） */
  float jit = hash12(gl_FragCoord.xy + vec2(uJitter * 71.7, uJitter * 131.3));
  float t   = t0 + jit * dt;

  if (uDebug > 4.5){
    return vec4(heightProfile((ro.y + rd.y * t - uBase) / shell, uType),
                hash12(gl_FragCoord.xy), 0.0, 1.0);
  }

  float wsum = 0.0, dSum = 0.0, maxD = 0.0;

  for (int i = 0; i < 192; i++){
    if (i >= n || t >= t1 || trans < 0.008) break;

    vec3  p = ro + rd * t;
    float h01;
    vec3  wq = domainWarp(p);
    float d = cloudDensityW(p, wq, h01);
    gDbgSteps += 1.0;
    if (d <= 0.002) gDbgSkips += 1.0;
    dSum += d; maxD = max(maxD, d);

    if (d > 0.002){
      float sigma = d * sigmaE;
      float a = 1.0 - exp(-sigma * dt);

      float tau = lightTau(p, wq, sigmaE, uLightSteps);
      float ambOcc;
      float ms = multiScatter(tau, mu, ambOcc);

      /* 粉化：稀薄边缘压暗（深度线索）。注意方向与旧版相反 —— 旧版让边缘发亮，
         结果整个云像在发光，这是"发白发灰"的原因之一。 */
      float powder = 1.0 - 0.8 * exp(-sigma * POWDER_LEN);

      if (uDebug > 7.5) {
        /* 光照诊断：R=多重散射量, G=太阳方向光学厚度(×0.1), B=powder */
        return vec4(clamp(ms, 0.0, 1.0), clamp(tau * 0.1, 0.0, 1.0), clamp(powder, 0.0, 1.0), 1.0);
      }

      vec3 sun = uSunColor * ms * SUN_GAIN;
      /* 天空是「辐照度」，太阳是「辐亮度」——量级差一个 1/4π。
         旧版直接把天色当环境光用，环境光于是比太阳还亮 → 云和天空同色、发白发灰。 */
      vec3 amb = mix(uSkyHorizon, uSkyTop, h01)
               * (0.35 + 0.65 * ambOcc) * uSkyScale * uAmbScale * SKY_AMB;
      vec3 col = (sun + amb) * powder;

      if (uAerial > 0.5){
        float aer = 1.0 - exp(-t * uAerialK);
        col = mix(col, haze, clamp(aer, 0.0, 0.96));
      }

      acc   += col * a * trans;
      trans *= (1.0 - a);
      outDist += t * a;
      wsum  += a;
    }

    t += dt;
    dt = min(dt * R, 1200.0);
  }

  if (wsum > 0.0) outDist /= wsum; else outDist = t0 + (t1 - t0) * 0.4;

  if (uDebug > 5.5) return vec4(vec3(gDbgSteps / float(max(uSteps, 1))), 1.0);
  if (uDebug > 2.5) return vec4(clamp(dSum * 2.0, 0.0, 1.0), maxD, clamp(1.0 - trans, 0.0, 1.0), 1.0);
  if (uDebug > 0.5) return vec4(gDbgShape, gDbgCover, gDbgBody, 1.0);
  return vec4(acc, trans);
}

/* 天空：与云共用同一套 palette，云的霾色才有地方对齐 */
vec3 skyColor(vec3 rd){
  float y = clamp(rd.y, 0.0, 1.0);
  vec3 c = mix(uSkyHorizon, uSkyTop, pow(y, 0.48)) * uSkyScale;
  float s = max(dot(rd, uSunDir), 0.0);
  c += uSunColor * pow(s, 10.0) * 0.020;
  c += uSunColor * smoothstep(0.99955, 0.99985, s) * 2.4;
  return c;
}
// <<< CLOUD-KERNEL:END

vec3 rayDir(){
  vec2 ndc = gl_FragCoord.xy / uRes * 2.0 - 1.0;
  return normalize(uCamBasis * vec3(ndc.x * uAspect * uFovTan, ndc.y * uFovTan, -1.0));
}

void main(){
  float dist;
  vec4 cl = marchClouds(uCamPos, rayDir(), dist);
  vec3 rgb = max(cl.rgb, 0.0);
  if (uStoreLdr > 0.5) rgb = sqrt(rgb);
  fragColor = vec4(rgb, cl.a);
}
</script>

<script id="fsAccum" type="x-shader/x-fragment">
#version 300 es
precision highp float;
out vec4 fragColor;
uniform sampler2D uCur;
uniform sampler2D uPrev;
uniform float uBlend;
void main(){
  ivec2 p = ivec2(gl_FragCoord.xy);
  vec4 cur  = texelFetch(uCur,  p, 0);
  vec4 prev = texelFetch(uPrev, p, 0);
  fragColor = mix(prev, cur, clamp(uBlend, 0.0, 1.0));
}
</script>

<script id="fsComp" type="x-shader/x-fragment">
#version 300 es
precision highp float;
precision highp sampler3D;
out vec4 fragColor;

uniform sampler2D uAccumTex;
uniform float uHazeK;

// >>> CLOUD-KERNEL:BEGIN
/* ===========================================================================
   CLOUD-KERNEL v2  ·  前端「灵活体积云」唯一真相来源
   ---------------------------------------------------------------------------
   由 _lab/tools/sync-kernel.mjs 注入到 lab 与 ship 的 CLOUD-KERNEL 标记区。
   不要直接编辑注入后的副本。

   理论骨架（参数化 / 可分级的近似映射）：
     密度   = 高度剖面(云型) × 天气覆盖(艺术输入) × 形状噪声 × 细节噪声
     光照   = 单次散射 + 4 阶指数和多重散射近似（贡献度 A / 遮蔽度 B 两个旋钮）
     积分   = 粗探针预步进（低分辨率探针 → 只在非空区加密采样）
              + 距离自适应步长 + 预算自适应 + 提前跳出
     介质   = Beer-Lambert 消光 + Henyey-Greenstein 双叶相位函数

   宿主负责：#version / precision / out 变量 / main()。
   本文件负责：全部 uniform 声明（宿主不得重复声明）。
   =========================================================================== */

uniform vec2  uRes;
uniform float uTime;
uniform float uJitter;
uniform vec3  uCamPos;
uniform mat3  uCamBasis;
uniform float uFovTan;
uniform float uAspect;

uniform sampler3D uNoise;
uniform sampler3D uWorley;
uniform float uNoiseLo,  uNoiseHi;
uniform float uWorleyLo, uWorleyHi;

uniform vec2  uSeedXZ;      // 噪声域偏移：把「哪朵云在你头顶」变成艺术参数
uniform float uCoverage;    // 0..1  天空被覆盖的比例（艺术输入）
uniform float uType;        // 0 层云 .. 1 积云 .. 2 积雨云
uniform float uDensityMul;  // 密度倍率
uniform float uDetail;      // 0..1 细节噪声振幅
uniform float uBase, uTop;  // 云底 / 云顶海拔（米）
uniform float uMaxDist;     // 最远追踪距离（米）
uniform float uWind;        // 漂移速度 m/s

uniform vec3  uSunDir;      // 指向太阳的单位向量
uniform vec3  uSunColor;    // 太阳辐亮度（含艺术增益，宿主负责量级）
uniform vec3  uSkyTop, uSkyHorizon, uHazeColor;
uniform float uSkyScale;    // 天空/环境光整体缩放（昼夜）

uniform float uAerial, uAerialK;   // 空气透视开关 / 密度 1/m
uniform float uMSContrib;          // 多重散射「贡献度」 A
uniform float uMSOccl;             // 多重散射「遮蔽度」 B
uniform float uPowder;             // 粉化（边缘透光）强度
uniform float uPhaseG, uPhaseMix;  // HG 双叶参数
uniform float uAmbScale;           // 环境光倍率

uniform int   uSteps, uLightSteps;
uniform float uStoreLdr;
uniform float uDebug;

const float PI      = 3.14159265359;
const float R_EARTH = 6371000.0;
const float EXT_PER_DENSITY = 0.0012;   // 归一化密度 1.0 对应的消光系数 (1/m)

/* ── 光照标定（这三条是按我们的 σe 量级实测标出来的，别照抄参考实现的数值）──
   SUN_GAIN : 参考实现的太阳辐亮度是物理量级（HDR 几十~几百）；我们的 uSunColor
              只有 11，多重散射归一后又只剩 ~0.1，实测云体比天空还暗。这里补艺术增益。
   SKY_AMB  : 天空色是「辐照度」，进云要转成辐亮度。参考用 1/4π≈0.08（它有色度 LUT），
              我们的 palette 不是物理量，实测 0.08 让暗面死黑、云和背景同色 → 用 0.30。
   POWDER_LEN: 参考的 exp(-σe·150) 是它自己的消光量级（σe≈0.01/m）。我们 σe≈0.0012/m，
              同一数值会把整片云乘掉 70%（实测 0.11）→ 长度尺度放大到 1000 m。        */
const float SUN_GAIN    = 4.0;
const float SKY_AMB     = 0.30;
const float POWDER_LEN  = 1000.0;
/* 密度底噪门限：低于它的密度一律当空气。腐蚀算子的连续尾巴会在平视时
   累积成满屏白絮（用户报的"云朵间隙模糊散落"）。0.10 = 吃掉最稀的 10%。 */
const float DENSITY_FLOOR = 0.10;

/* ── 去规整化：频段分离 + 两层域扭曲（2026-10-20）────────────────────────
   旧做法天气场和形状场都用 0.00030 采样同一张 64³ 平铺纹理：单一 3.3 km 周期，
   20 km 视距内精确复读约 6 次，俯视就是一张规则网格（证据：
   _lab/cloud/shots/look-base/top-dbg2.png 与 look-after/top-dbg2.png）。

   两条一起改：
   1) **频段分离**：天气 / 形状 / 两层扭曲分别用 30 / 37 / 19 / 23 ×1e-5。
      纹理本身是无缝平铺的（Perlin 生成时按整数周期 wrap，见宿主 buildNoise），
      所以任何频率都不会出新接缝；而四个互质整数频率的**联合周期 = 1e5 m = 100 km**
      （T 必须同时是 1e5/30、1e5/37、1e5/19、1e5/23 的整数倍，最小解 T=1e5）。
      20 km 视距只走到 1/5 个周期，不再整块复读。**不要**把某个频段改成
      非整数 ×1e-5（例如 30.5），那会让联合周期塌回几十公里以内，重复感回来。
   2) **两层域扭曲**：每层一个低频噪声标量，各自不同 offset、不同频率，
      合计把采样位置最多推开 ±0.9 km/轴（约 0.5 个天气特征尺寸），Perlin 的
      轴向格子被揉成有机分布。扭曲场自己的频率（19/23）与天气（30）不同，
      于是「天气 ∘ 扭曲」的联合周期也是 100 km —— 只改频段不加扭曲，
      天气覆盖的空洞仍会按 3.3 km 的节奏排队；只加扭曲不改频段，
      扭曲场和天气同周期时复读也还在。两件事必须一起做。            */
const vec2  W_OFF   = vec2(0.137, 0.571);   // 天气场 offset
const vec2  S_OFF   = vec2(0.619, 0.233);   // 形状场 offset（与天气错开，避免同相）
const vec2  W1_OFF  = vec2(0.317, 0.811);   // 域扭曲第 1 层 offset
const vec2  W2_OFF  = vec2(0.743, 0.129);   // 域扭曲第 2 层 offset
const float W_SCALE  = 0.00030;             // 30e-5  天气场
const float S_SCALE  = 0.00037;             // 37e-5  形状场
const float W1_SCALE = 0.00019;             // 19e-5  扭曲层 1
const float W2_SCALE = 0.00023;             // 23e-5  扭曲层 2
const float WARP_AMP = 1800.0;              // 米：每轴 ±0.9 km（两层各 (n-0.5)*1800）

/* 两层域扭曲：返回世界空间 XZ 位移（米）+ 第 2 层的原始值（z 分量，
   给覆盖度当大尺度晴/云分区用）。两个标量各推一个轴。 */
vec3 domainWarp(vec3 q){
  float a = texture(uNoise, vec3(q.xz * W1_SCALE + W1_OFF, 0.211)).r;
  float b = texture(uNoise, vec3(q.xz * W2_SCALE + W2_OFF, 0.733)).r;
  return vec3((vec2(a, b) - 0.5) * WARP_AMP, b);
}

/* 调试输出（lab 用，ship 忽略） */
float gDbgShape, gDbgCover, gDbgBody, gDbgSteps, gDbgSkips;

float hash12(vec2 p){
  vec3 p3 = fract(vec3(p.xyx) * 0.1031);
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.x + p3.y) * p3.z);
}

vec2 raySphere(vec3 ro, vec3 rd, float r){
  vec3 oc = ro - vec3(0.0, -R_EARTH, 0.0);
  float b = dot(oc, rd);
  float c = dot(oc, oc) - r * r;
  float h = b * b - c;
  if (h < 0.0) return vec2(-1.0, -1.0);
  h = sqrt(h);
  return vec2(-b - h, -b + h);
}

/* 把噪声重标定到 0..1：数组的 p5/p95 由 CPU 侧实测传入，阈值因此可以跨噪声设置复现 */
float nrm(float v, float lo, float hi){
  return clamp((v - lo) / max(hi - lo, 1e-5), 0.0, 1.0);
}

/* ── 高度剖面：同一条公式派生三种云型 ──────────────────────────────────────
   层云 = 薄的均匀板；积云 = 圆顶；积雨云 = 塔状 + 顶部砧状展开。            */
float heightProfile(float h, float type){
  float bot   = smoothstep(0.0, 0.055, h);
  float slab  = 1.0 - smoothstep(0.45, 0.92, h);
  float dome  = 1.0 - smoothstep(0.26, 0.78, h);
  float tower = 1.0 - smoothstep(0.50, 0.90, h);
  float lo = mix(slab, dome, clamp(type, 0.0, 1.0));
  float hi = mix(dome, tower, clamp(type - 1.0, 0.0, 1.0));
  float p  = mix(lo, hi, step(1.0, type));
  float anvil = smoothstep(0.62, 0.97, h) * (1.0 - smoothstep(0.975, 1.0, h));
  p = max(p, anvil * clamp(type - 1.0, 0.0, 1.0));
  return bot * clamp(p, 0.0, 1.0);
}

/* 线性重映射（参考实现的 remapClamped）。整条密度链只用这个，不用 smoothstep 阈值。 */
float remap01(float v, float lo, float hi){
  return clamp((v - lo) / max(hi - lo, 1e-5), 0.0, 1.0);
}

float hgPhase(float c, float g){
  float g2 = g * g;
  return (1.0 - g2) / (4.0 * PI * pow(max(1.0 + g2 - 2.0 * g * c, 1e-4), 1.5));
}
/* 双叶 HG 的凸组合：权重和为 1，所以整个球面的积分仍然守恒 */
float phaseFn(float mu){
  float g = uPhaseG;
  float m = clamp(uPhaseMix * 0.5 + 0.5, 0.0, 1.0);
  return mix(hgPhase(mu, g), hgPhase(mu, -g * 0.45), m);
}

/* ── 密度 v3 ───────────────────────────────────────────────────────────────
   把旧的「5 路噪声加权和 + smoothstep(0.40,0.56) 绝对阈值」换成
   「覆盖度软斜坡 + 腐蚀算子」。为什么这决定了有没有体积感
   （见 _wip/NOTES-takram-shader-distill.md §2.3）：

     1. 腐蚀而不是乘法：density = remap(density, (1-shape)*amount, 1)
        —— 云的**表面**变成 shape 噪声的等值面；shape 高则阈值低、该处保留，
        shape 低则被"啃掉"。乘法只改体内部亮度，把表面温度写死成某个常数，
        于是任何视角下都是同一层壳 → 平板感。
     2. 没有绝对阈值：全链只有线性斜坡，云内密度连续 0→1。
        二值化的色块没有内部梯度，光打上去只剩一个平色。
     3. 竖向半圆偏置 hs = 1-x²：云在底/顶收窄，这是积云轮廓的来源。
     4. 双尺度：shape 3.3 km（大菜花）+ Worley 167 m（小绒球）两级腐蚀。

   高度剖面 prof 放最前面：为 0 的空域直接 return，省掉 4 次 3D 采样。      */
float cloudDensityW(vec3 p, vec3 wq, out float h01){
  h01 = (p.y - uBase) / max(uTop - uBase, 1.0);
  float hf = clamp(h01, 0.0, 1.0);
  float prof = heightProfile(hf, uType);
  if (prof <= 5e-4) return 0.0;

  vec3 q = p + vec3(uSeedXZ.x, 0.0, uSeedXZ.y) - vec3(uWind, 0.0, uWind * 0.35) * uTime;

  /* ── 1. 天气 → 覆盖度：宽 0.6 的软斜坡，factor 随高度做半圆偏置 ──
     关键：先把天气往「满覆盖」拉 60%（参考实现的 mix(localWeather,1,covFilterWidth)），
     再在 [factor, factor+0.6] 上做线性斜坡。少了这一步，coverage=0.44 实际只覆盖
     约 10% 天空，云会退化成地平线上的几个小点（实测：p1-v3）。

     尺度：天气场原来是 16 km 周期 —— 从地面平视时，一朵云就占满整个视野，
     数不出独立云团，看上去必然是一面墙。改成 3.3 km 周期（主导特征约 1~2 km），
     20 km 外一眼能看到 5~10 朵分开的积云，中间露出天空。                     */
  /* 域扭曲后的采样位置：天气 / 形状用不同的频率与 offset（周期 100 km，见文件顶部）。
     wq 由调用方传入，主 march 每步算一次，光照步复用命中点的那一个。 */
  vec3 qw = q + vec3(wq.x, 0.0, wq.y);

  float weather = nrm(texture(uNoise, vec3(qw.xz * W_SCALE + W_OFF, 0.37)).r, uNoiseLo, uNoiseHi);
  float cov  = clamp(uCoverage, 0.0, 1.0);
  float xh   = clamp(pow(hf, 0.35) * 2.0 - 1.0, -1.0, 1.0);
  float hs   = 1.0 - xh * xh;
  float factor = 1.0 - cov * hs;
  /* 大尺度晴/云分区（5.3 km 尺度）。
     这里修掉一个结构性 bug：旧写法 mix(weather,1,0.60) 的下限是 0.60，
     而 factor 在中高度只有 1-cov≈0.56 → occ 永远 >0，天中间任何地方都有云，
     云场只能是一层铺满的「爆米花」。现在晴区最低只 mix 到 0.10，
     低于 factor → 真·零覆盖，团与团之间才露出天空。 */
  float big  = smoothstep(0.20, 0.62, wq.z);
  float fill = mix(0.10, 0.52, big);
  float occ  = remap01(mix(weather, 1.0, fill), factor, factor + 0.50);
  if (occ <= 5e-4) return 0.0;

  /* ── 2. 形状腐蚀：37e-5 频率（FBM 4 octave，最细约 110 m）── */
  float shape = nrm(texture(uNoise, vec3(qw.xz * S_SCALE + S_OFF, q.y * S_SCALE)).r, uNoiseLo, uNoiseHi);
  float amt   = mix(0.42, 0.80, clamp(uDetail, 0.0, 1.0));
  float d     = remap01(occ, (1.0 - shape) * amt, 1.0);

  /* ── 3. 细节腐蚀：Worley 胞约 167 m。顶部 = 圆润蓬松，底部 = 缕状撕边 ── */
  float det = nrm(texture(uWorley, q * 0.00120).r, uWorleyLo, uWorleyHi);
  float mod = mix(pow(det, 6.0), 1.0 - det, smoothstep(0.20, 0.40, hf));
  d = remap01(d * 2.0, mod * 0.5, 1.0);

  /* ── 4. 高度剖面 + 上密下疏 ── */
  d *= prof;
  d *= 0.25 + 0.75 * hf;

  /* ── 5. 密度底噪门限（DENSITY_FLOOR）──────────────────────────────────────
     腐蚀算子是连续的，所以凡是「刚过阈值」的地方都会留下 1%~8% 的密度尾巴。
     平视时这些尾巴沿视线累积成一整片发白的薄雾 —— 用户报的
     「云朵间隙有模糊散落、很丑」就是它（实测：覆盖率 0.21 时整片天空都是白絮）。
     低于门限一律当空气：云有干净的轮廓，云间隙是真的天空。               */
  d = remap01(d, DENSITY_FLOOR, 1.0);

  gDbgShape = shape; gDbgCover = occ; gDbgBody = d;
  return d * uDensityMul;
}

/* 通用入口：自己算扭曲向量 */
float cloudDensity(vec3 p, out float h01){ return cloudDensityW(p, domainWarp(p), h01); }

/* 只算密度的光照版：复用命中点的扭曲向量。太阳方向一次穿 2.3 km 云层，
   而扭曲场的变化尺度是 4~5 km，所以沿这条光程用同一个 wq 误差在噪声内，
   换来的是每次命中少 2*uLightSteps 次纹理采样。 */
float densityLite(vec3 p, vec3 wq){ float h; return cloudDensityW(p, wq, h); }

/* ── 多重散射：Kulla-Conty 指数和，8 阶 ────────────────────────────────────
   每一阶同时衰减三样东西，比例都是 0.5^i：
     beer  = exp(-tau * 0.5^i)      ← 散射一次后剩余光程更短
     能量  × 0.5^i
     相位各向异性 g × 0.5^i         ← 越往高阶越接近各向同性
   第 0 阶就是纯单次散射；tau=0 时归一化回平均相位，不凭空造能量。
   旧的固定 4 阶 + 两个独立旋钮做不到「相位也一起塌缩」，背光面因此发灰。   */
float multiScatter(float tau, float mu, out float ambOcc){
  float g = clamp(uPhaseG, 0.0, 0.95);
  float m = clamp(uPhaseMix * 0.5 + 0.5, 0.0, 1.0);
  float sum = 0.0, norm = 0.0, w = 1.0, e = 1.0, gs = g;
  for (int o = 0; o < 8; o++){
    float ph = mix(hgPhase(mu, gs), hgPhase(mu, -gs * 0.45), m);
    sum  += w * exp(-e * tau) * ph;
    norm += w;
    w *= 0.5; e *= 0.5; gs *= 0.5;
  }
  /* 云内部的环境光被自身遮蔽：光学厚度越大，天光进得越少 → 顶亮底暗 */
  ambOcc = exp(-tau * 0.30);
  return sum / max(norm, 1e-4);
}

/* 沿太阳方向积分光学厚度（Beer-Lambert）。空域提前跳出。 */
float lightTau(vec3 p, vec3 wq, float sigmaE, int n){
  float ls = max((uTop - uBase) / float(n), 40.0);
  float tau = 0.0;
  for (int j = 0; j < 16; j++){
    if (j >= n) break;
    vec3 lp = p + uSunDir * (float(j) + 0.5) * ls;
    if (lp.y < uBase - 300.0) break;
    tau += densityLite(lp, wq) * ls * sigmaE;
  }
  return tau;
}

/* ── 主追踪 ────────────────────────────────────────────────────────────────
   返回 vec4(预乘内散射 rgb, 透射率 a)。

   采样 v3 —— 透视几何步长：
     dt 从 dt0 起按 R 增长；dt0 由「几何级数求和恰好铺满 [t0,t1]」反解，
     并夹到 ≥45 m。于是同样 n 个样本覆盖整条射线，近处 45~100 m / 远处数百米，
     而不是旧方案「990 m 探针格 + 格内 3~5 刀」的常数密度切片。

   抖动：每帧每像素一个偏移，作用于**首步**（整条射线一起滑）。
     步边界逐帧稳定 → 时间累积不会糊；累积把首步的阶梯收敛掉。
   ------------------------------------------------------------------------ */
vec4 marchClouds(vec3 ro, vec3 rd, out float outDist){
  outDist = 0.0;
  float trans = 1.0;
  vec3 acc = vec3(0.0);
  gDbgSteps = 0.0; gDbgSkips = 0.0;

  /* 只有「相机在云底之下 + 向下看」才必然无云；相机在云层之上时向下看应该看得见云 */
  if (rd.y <= 0.0 && ro.y < uBase) return vec4(acc, trans);

  vec2 outer = raySphere(ro, rd, R_EARTH + uTop);
  if (outer.y < 0.0) return vec4(acc, trans);
  float t0 = max(outer.x, 0.0);
  float t1 = min(outer.y, t0 + uMaxDist);

  /* 云区 = 在云顶球之内、且在云底球之外。相机在云底之下时射线「先出云底球」，
     相机在云层之上时射线「先进云底球」——两种情形切法相反。 */
  float rIn = R_EARTH + uBase;
  float dc  = length(ro - vec3(0.0, -R_EARTH, 0.0));
  vec2 inner = raySphere(ro, rd, rIn);
  if (dc < rIn) {
    if (inner.y > t0) t0 = max(t0, inner.y);
  } else if (inner.x > 0.0) {
    t1 = min(t1, inner.x);
  }
  if (t1 <= t0) return vec4(acc, trans);

  float span   = t1 - t0;
  float shell  = max(uTop - uBase, 1.0);
  float sigmaE = EXT_PER_DENSITY * uDensityMul;
  float mu     = dot(rd, uSunDir);
  vec3  haze   = uHazeColor * (0.72 + 0.28 * clamp(uSunDir.y * 3.0, 0.0, 1.0));

  int n = clamp(uSteps, 8, 192);
  const float R = 1.02;
  float dt = span * (R - 1.0) / max(pow(R, float(n)) - 1.0, 1e-4);
  dt = clamp(dt, 45.0, 400.0);

  /* 每帧/每像素的射线抖动：整条射线在第一个步长内滑动（只抖首步） */
  float jit = hash12(gl_FragCoord.xy + vec2(uJitter * 71.7, uJitter * 131.3));
  float t   = t0 + jit * dt;

  if (uDebug > 4.5){
    return vec4(heightProfile((ro.y + rd.y * t - uBase) / shell, uType),
                hash12(gl_FragCoord.xy), 0.0, 1.0);
  }

  float wsum = 0.0, dSum = 0.0, maxD = 0.0;

  for (int i = 0; i < 192; i++){
    if (i >= n || t >= t1 || trans < 0.008) break;

    vec3  p = ro + rd * t;
    float h01;
    vec3  wq = domainWarp(p);
    float d = cloudDensityW(p, wq, h01);
    gDbgSteps += 1.0;
    if (d <= 0.002) gDbgSkips += 1.0;
    dSum += d; maxD = max(maxD, d);

    if (d > 0.002){
      float sigma = d * sigmaE;
      float a = 1.0 - exp(-sigma * dt);

      float tau = lightTau(p, wq, sigmaE, uLightSteps);
      float ambOcc;
      float ms = multiScatter(tau, mu, ambOcc);

      /* 粉化：稀薄边缘压暗（深度线索）。注意方向与旧版相反 —— 旧版让边缘发亮，
         结果整个云像在发光，这是"发白发灰"的原因之一。 */
      float powder = 1.0 - 0.8 * exp(-sigma * POWDER_LEN);

      if (uDebug > 7.5) {
        /* 光照诊断：R=多重散射量, G=太阳方向光学厚度(×0.1), B=powder */
        return vec4(clamp(ms, 0.0, 1.0), clamp(tau * 0.1, 0.0, 1.0), clamp(powder, 0.0, 1.0), 1.0);
      }

      vec3 sun = uSunColor * ms * SUN_GAIN;
      /* 天空是「辐照度」，太阳是「辐亮度」——量级差一个 1/4π。
         旧版直接把天色当环境光用，环境光于是比太阳还亮 → 云和天空同色、发白发灰。 */
      vec3 amb = mix(uSkyHorizon, uSkyTop, h01)
               * (0.35 + 0.65 * ambOcc) * uSkyScale * uAmbScale * SKY_AMB;
      vec3 col = (sun + amb) * powder;

      if (uAerial > 0.5){
        float aer = 1.0 - exp(-t * uAerialK);
        col = mix(col, haze, clamp(aer, 0.0, 0.96));
      }

      acc   += col * a * trans;
      trans *= (1.0 - a);
      outDist += t * a;
      wsum  += a;
    }

    t += dt;
    dt = min(dt * R, 1200.0);
  }

  if (wsum > 0.0) outDist /= wsum; else outDist = t0 + (t1 - t0) * 0.4;

  if (uDebug > 5.5) return vec4(vec3(gDbgSteps / float(max(uSteps, 1))), 1.0);
  if (uDebug > 2.5) return vec4(clamp(dSum * 2.0, 0.0, 1.0), maxD, clamp(1.0 - trans, 0.0, 1.0), 1.0);
  if (uDebug > 0.5) return vec4(gDbgShape, gDbgCover, gDbgBody, 1.0);
  return vec4(acc, trans);
}

/* 天空：与云共用同一套 palette，云的霾色才有地方对齐 */
vec3 skyColor(vec3 rd){
  float y = clamp(rd.y, 0.0, 1.0);
  vec3 c = mix(uSkyHorizon, uSkyTop, pow(y, 0.48)) * uSkyScale;
  float s = max(dot(rd, uSunDir), 0.0);
  c += uSunColor * pow(s, 10.0) * 0.020;
  c += uSunColor * smoothstep(0.99955, 0.99985, s) * 2.4;
  return c;
}
// <<< CLOUD-KERNEL:END

vec3 rayDir(){
  vec2 ndc = gl_FragCoord.xy / uRes * 2.0 - 1.0;
  return normalize(uCamBasis * vec3(ndc.x * uAspect * uFovTan, ndc.y * uFovTan, -1.0));
}

vec3 seaColor(vec3 ro, vec3 rd, out float dist){
  if (rd.y > -1.0e-5) { dist = 1.0e9; return uHazeColor; }
  float t = -ro.y / rd.y;
  dist = t;
  vec3 n = vec3(0.0, 1.0, 0.0);
  vec3 v = -rd;
  vec3 h = normalize(uSunDir + v);
  float ndh = max(dot(n, h), 0.0);
  float ndv = max(dot(n, v), 0.0);
  float fres = 0.02 + 0.98 * pow(1.0 - ndv, 5.0);
  vec3 deep = vec3(0.020, 0.055, 0.085);
  vec3 shallow = vec3(0.040, 0.115, 0.155);
  vec3 body = mix(deep, shallow, clamp(fres * 1.9, 0.0, 1.0));
  vec3 refl = skyColor(reflect(rd, n));
  vec3 col = mix(body, refl, clamp(fres * 1.5, 0.0, 1.0));
  col += uSunColor * ((pow(ndh, 1200.0) * 0.55 + pow(ndh, 90.0) * 0.02) * uSkyScale);
  return col;
}

void main(){
  vec3 rd = rayDir();
  /* 累积缓冲比画布小，LINEAR 上采样顺带把抖动抹平 */
  vec4 cl = texture(uAccumTex, gl_FragCoord.xy / uRes);
  if (uStoreLdr > 0.5) cl.rgb = cl.rgb * cl.rgb;
  float T = clamp(cl.a, 0.0, 1.0);
  if (uDebug > 0.5) { fragColor = vec4(cl.rgb, 1.0); return; }

  vec3 col;
  if (rd.y < -1.0e-5) {
    float dist;
    col = seaColor(uCamPos, rd, dist);
    if (uAerial > 0.5) {
      vec3 haze = uHazeColor * (0.72 + 0.28 * clamp(uSunDir.y * 3.0, 0.0, 1.0));
      col = mix(col, haze, clamp(1.0 - exp(-dist * uAerialK), 0.0, 0.97));
    }
  } else {
    vec3 sky = skyColor(rd);
    if (uAerial > 0.5) {
      vec3 haze = uHazeColor * (0.72 + 0.28 * clamp(uSunDir.y * 3.0, 0.0, 1.0));
      float skyFog = 1.0 - exp(-pow(max(rd.y, 0.012), -0.9) * 0.055 * uHazeK);
      sky = mix(sky, haze, clamp(skyFog, 0.0, 0.97));
    }
    col = sky;
  }
  /* 云合成必须放在海/天分支之外：俯视时 rd.y<0，旧写法把 cl 整段丢掉，
     从云层上方永远看不到云（只能靠 debug 模式看场）。2026-10-20 修。 */
  col = col * T + cl.rgb;

  col = col / (col + vec3(0.88)) * 1.10;
  col = pow(max(col, 0.0), vec3(1.0 / 2.2));
  fragColor = vec4(col, 1.0);
}
</script>

<script>
"use strict";
(function () {
  const canvas = document.getElementById("stage");
  const errBox = document.getElementById("err");
  const fail = (m) => { errBox.style.display = "grid"; errBox.textContent = m; console.error(m); };
  const txt = (id) => document.getElementById(id).textContent.trim();

  const gl = canvas.getContext("webgl2", {
    antialias: false, alpha: false, depth: false, stencil: false,
    powerPreference: "high-performance",
  });
  if (!gl) { fail("WebGL2 不可用：这个实验室需要 WebGL2（新版 Chrome / Edge / Firefox 都支持）。"); return; }

  const hasFloat = !!gl.getExtension("EXT_color_buffer_float");
  const hasHalf = !!gl.getExtension("EXT_color_buffer_half_float");
  const HDR = hasFloat || hasHalf;
  const RT_IFMT = HDR ? gl.RGBA16F : gl.RGBA8;
  const RT_TYPE = HDR ? gl.HALF_FLOAT : gl.UNSIGNED_BYTE;

  /* ── 程序化噪声：一次生成，永久复用 ───────────────────────────────────── */
  function buildNoise(size, octaves) {
    const data = new Uint8Array(size * size * size);
    const hash = (x, y, z) => {
      let h = Math.imul(x, 374761393) ^ Math.imul(y, 668265263) ^ Math.imul(z, 1274126177);
      h = Math.imul(h ^ (h >>> 13), 1274126177);
      return ((h ^ (h >>> 16)) >>> 0) / 4294967295;
    };
    const fade = (t) => t * t * (3 - 2 * t);
    const mix = (a, b, t) => a + (b - a) * t;
    const wrap = (v, p) => ((v % p) + p) % p;
    const noise = (x, y, z, p) => {
      const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
      const xf = fade(x - xi), yf = fade(y - yi), zf = fade(z - zi);
      const at = (dx, dy, dz) => hash(wrap(xi + dx, p), wrap(yi + dy, p), wrap(zi + dz, p));
      const x00 = mix(at(0,0,0), at(1,0,0), xf), x10 = mix(at(0,1,0), at(1,1,0), xf);
      const x01 = mix(at(0,0,1), at(1,0,1), xf), x11 = mix(at(0,1,1), at(1,1,1), xf);
      return mix(mix(x00, x10, yf), mix(x01, x11, yf), zf);
    };
    const weights = [0.50, 0.26, 0.15, 0.09];
    let i = 0;
    for (let z = 0; z < size; z++) for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
      let n = 0, amp = 0;
      for (let o = 0; o < octaves; o++) {
        const p = 4 << o;
        n += noise(x / size * p, y / size * p, z / size * p, p) * weights[o];
        amp += weights[o];
      }
      data[i++] = Math.max(0, Math.min(255, Math.round((n / amp) * 255)));
    }
    return data;
  }

  function buildWorley(size, period) {
    const data = new Uint8Array(size * size * size);
    const hash = (x, y, z) => {
      let h = Math.imul(x, 374761393) ^ Math.imul(y, 668265263) ^ Math.imul(z, 1274126177);
      h = Math.imul(h ^ (h >>> 13), 1274126177);
      return ((h ^ (h >>> 16)) >>> 0) / 4294967295;
    };
    const wrap = (v, p) => ((v % p) + p) % p;
    let i = 0;
    for (let z = 0; z < size; z++) for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
      const px = x / size * period, py = y / size * period, pz = z / size * period;
      const xi = Math.floor(px), yi = Math.floor(py), zi = Math.floor(pz);
      let best = 1e9;
      for (let dz = -1; dz <= 1; dz++) for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
        const cx = xi + dx, cy = yi + dy, cz = zi + dz;
        const wx = wrap(cx, period), wy = wrap(cy, period), wz = wrap(cz, period);
        const fx = cx + 0.15 + 0.70 * hash(wx, wy, wz);
        const fy = cy + 0.15 + 0.70 * hash(wx + 37, wy + 91, wz + 13);
        const fz = cz + 0.15 + 0.70 * hash(wx + 71, wy + 23, wz + 57);
        const dd = (fx - px) * (fx - px) + (fy - py) * (fy - py) + (fz - pz) * (fz - pz);
        if (dd < best) best = dd;
      }
      data[i++] = Math.max(0, Math.min(255, Math.round((1 - Math.min(1, Math.sqrt(best))) * 255)));
    }
    return data;
  }

  /* 实测噪声分布 → uniform 里的 lo/hi，阈值才能跨设置复现（自标定） */
  function percentiles(data) {
    const h = new Uint32Array(256);
    for (let i = 0; i < data.length; i++) h[data[i]]++;
    const lo = data.length * 0.05, hi = data.length * 0.95;
    let acc = 0, p5 = 0, p95 = 255, gotLo = false;
    for (let i = 0; i < 256; i++) {
      acc += h[i];
      if (!gotLo && acc >= lo) { p5 = i; gotLo = true; }
      if (acc >= hi) { p95 = i; break; }
    }
    return [p5 / 255, p95 / 255];
  }

  const tN = performance.now();
  const NOISE_SIZE = 64, W_SIZE = 32;
  const noiseData = buildNoise(NOISE_SIZE, 4);
  const noiseMs = Math.round(performance.now() - tN);
  const wT = performance.now();
  const worleyData = buildWorley(W_SIZE, 5);
  const worleyMs = Math.round(performance.now() - wT);
  const nPct = percentiles(noiseData), wPct = percentiles(worleyData);

  function tex3D(size, data) {
    const t = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_3D, t);
    gl.texImage3D(gl.TEXTURE_3D, 0, gl.R8, size, size, size, 0, gl.RED, gl.UNSIGNED_BYTE, data);
    gl.texParameteri(gl.TEXTURE_3D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_3D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_3D, gl.TEXTURE_WRAP_S, gl.REPEAT);
    gl.texParameteri(gl.TEXTURE_3D, gl.TEXTURE_WRAP_T, gl.REPEAT);
    gl.texParameteri(gl.TEXTURE_3D, gl.TEXTURE_WRAP_R, gl.REPEAT);
    return t;
  }
  const texNoise = tex3D(NOISE_SIZE, noiseData);
  const texWorley = tex3D(W_SIZE, worleyData);

  function compile(type, src, tag) {
    const sh = gl.createShader(type);
    gl.shaderSource(sh, src);
    gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
      fail(tag + " 编译失败：\n" + gl.getShaderInfoLog(sh)); return null;
    }
    return sh;
  }
  function program(fsId, tag) {
    const vs = compile(gl.VERTEX_SHADER, txt("vs"), tag + ".vs");
    const fs = compile(gl.FRAGMENT_SHADER, txt(fsId), tag + ".fs");
    if (!vs || !fs) return null;
    const p = gl.createProgram();
    gl.attachShader(p, vs); gl.attachShader(p, fs); gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) { fail(tag + " 链接失败：\n" + gl.getProgramInfoLog(p)); return null; }
    return p;
  }
  const progCloud = program("fsCloud", "cloud");
  const progAccum = program("fsAccum", "accum");
  const progComp  = program("fsComp", "composite");
  if (!progCloud || !progAccum || !progComp) return;

  const LOC = new Map();
  function loc(p, n) {
    let m = LOC.get(p); if (!m) { m = new Map(); LOC.set(p, m); }
    if (!m.has(n)) m.set(n, gl.getUniformLocation(p, n));
    return m.get(n);
  }
  const u1f = (p, n, v) => { const l = loc(p, n); if (l) gl.uniform1f(l, v); };
  const u1i = (p, n, v) => { const l = loc(p, n); if (l) gl.uniform1i(l, v); };
  const u2f = (p, n, a, b) => { const l = loc(p, n); if (l) gl.uniform2f(l, a, b); };
  const u3f = (p, n, a, b, c) => { const l = loc(p, n); if (l) gl.uniform3f(l, a, b, c); };
  const um3 = (p, n, v) => { const l = loc(p, n); if (l) gl.uniformMatrix3fv(l, false, v); };

  /* ── 渲染目标 ─────────────────────────────────────────────────────────── */
  function makeRT(w, h) {
    const tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, RT_IFMT, w, h, 0, gl.RGBA, RT_TYPE, null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    const fbo = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    return { tex, fbo, w, h };
  }
  const freeRT = (rt) => { if (rt) { gl.deleteTexture(rt.tex); gl.deleteFramebuffer(rt.fbo); } };
  const bindRT = (rt) => {
    gl.bindFramebuffer(gl.FRAMEBUFFER, rt ? rt.fbo : null);
    gl.viewport(0, 0, rt ? rt.w : cw, rt ? rt.h : ch);
  };
  const vao = gl.createVertexArray();
  gl.bindVertexArray(vao);

  let cw = 0, ch = 0, rtW = 0, rtH = 0;
  let rtCloud = null, rtAccA = null, rtAccB = null;

  function ensureSize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = Math.max(2, Math.round((canvas.clientWidth || 320) * dpr));
    const h = Math.max(2, Math.round((canvas.clientHeight || 180) * dpr));
    const rw = Math.max(2, Math.round(w * P.scale));
    const rh = Math.max(2, Math.round(h * P.scale));
    if (w === cw && h === ch && rw === rtW && rh === rtH) return false;
    cw = w; ch = h; rtW = rw; rtH = rh;
    canvas.width = w; canvas.height = h;
    freeRT(rtCloud); freeRT(rtAccA); freeRT(rtAccB);
    rtCloud = makeRT(rtW, rtH); rtAccA = makeRT(rtW, rtH); rtAccB = makeRT(rtW, rtH);
    return true;
  }

  /* ── 参数与预设 ───────────────────────────────────────────────────────── */
  const P = {
    coverage: 0.44, type: 1.00, density: 1.20, detail: 0.60, base: 1400, top: 3200,
    msContrib: 0.55, msOccl: 0.55, powder: 1.00,
    sunEl: 32, sunAz: 24, wind: 18, haze: 1.00,
    steps: 56, light: 5, scale: 0.70, seedX: 0, seedZ: 0,
    aerial: true, accumulate: true, auto: true, budgetMs: 11,
    paused: false, debug: 0, maxDist: 32000,
  };
  const PRESETS = {
    cumulus: { coverage: 0.44, type: 1.00, density: 1.20, detail: 0.60, base: 1400, top: 3200, wind: 18, sunEl: 32, sunAz: 24, haze: 1.00, msContrib: 0.55, msOccl: 0.55, powder: 1.00 },
    stratus: { coverage: 0.80, type: 0.00, density: 0.90, detail: 0.35, base: 700, top: 1700, wind: 42, sunEl: 20, sunAz: 40, haze: 1.60, msContrib: 0.40, msOccl: 0.45, powder: 0.55 },
    storm:   { coverage: 0.90, type: 1.85, density: 2.00, detail: 0.75, base: 600, top: 7000, wind: 72, sunEl: 14, sunAz: 46, haze: 2.60, msContrib: 0.72, msOccl: 0.78, powder: 1.00 },
  };

  const SUN_RAD = [11.0, 9.9, 8.4];
  const SKY_TOP = [0.050, 0.150, 0.400];
  const SKY_HOR = [0.470, 0.590, 0.730];
  const HAZE_C  = [0.520, 0.610, 0.720];

  const cam = { yaw: 0.0, pitch: 0.10, fov: 55 * Math.PI / 180, pos: [0, 6, 0] };
  let dragging = false, lastX = 0, lastY = 0;
  canvas.addEventListener("pointerdown", (e) => { dragging = true; lastX = e.clientX; lastY = e.clientY; canvas.setPointerCapture(e.pointerId); });
  canvas.addEventListener("pointerup", (e) => { dragging = false; try { canvas.releasePointerCapture(e.pointerId); } catch (err) {} });
  canvas.addEventListener("pointermove", (e) => {
    if (!dragging) return;
    cam.yaw -= (e.clientX - lastX) * 0.0022;
    cam.pitch = Math.max(-1.20, Math.min(1.35, cam.pitch + (e.clientY - lastY) * 0.0018));
    lastX = e.clientX; lastY = e.clientY;
    dirty = true;
  });
  canvas.addEventListener("wheel", (e) => {
    e.preventDefault();
    cam.fov = Math.max(18 * Math.PI / 180, Math.min(95 * Math.PI / 180, cam.fov * (1 + Math.sign(e.deltaY) * 0.06)));
    dirty = true;
  }, { passive: false });

  let dirty = true;
  const markDirty = () => { dirty = true; };

  const bind = (id, key, out, fmt) => {
    const el = document.getElementById(id), o = document.getElementById(out);
    const sync = () => { o.textContent = fmt ? fmt(P[key]) : P[key]; el.value = P[key]; };
    el.addEventListener("input", () => {
      P[key] = parseFloat(el.value);
      if (key === "steps" || key === "scale") { P.auto = false; autoEl.checked = false; }
      sync(); markDirty();
    });
    el.__sync = sync; sync();
    return el;
  };
  const ctrls = [
    bind("coverage", "coverage", "oCoverage", (v) => v.toFixed(2)),
    bind("type", "type", "oType", (v) => v.toFixed(2)),
    bind("density", "density", "oDensity", (v) => v.toFixed(2)),
    bind("detail", "detail", "oDetail", (v) => v.toFixed(2)),
    bind("base", "base", "oBase", (v) => v.toFixed(0)),
    bind("top", "top", "oTop", (v) => v.toFixed(0)),
    bind("msContrib", "msContrib", "oMsC", (v) => v.toFixed(2)),
    bind("msOccl", "msOccl", "oMsO", (v) => v.toFixed(2)),
    bind("powder", "powder", "oPowder", (v) => v.toFixed(2)),
    bind("sunEl", "sunEl", "oSunEl", (v) => v.toFixed(0)),
    bind("sunAz", "sunAz", "oSunAz", (v) => v.toFixed(0)),
    bind("steps", "steps", "oSteps", (v) => v.toFixed(0)),
    bind("light", "light", "oLight", (v) => v.toFixed(0)),
    bind("scale", "scale", "oScale", (v) => v.toFixed(2)),
    bind("wind", "wind", "oWind", (v) => v.toFixed(0)),
    bind("haze", "haze", "oHaze", (v) => v.toFixed(2)),
  ];
  const aerialEl = document.getElementById("aerial");
  const accumEl = document.getElementById("accumulate");
  const autoEl = document.getElementById("autoBudget");
  aerialEl.addEventListener("change", () => { P.aerial = aerialEl.checked; markDirty(); });
  accumEl.addEventListener("change", () => { P.accumulate = accumEl.checked; markDirty(); });
  autoEl.addEventListener("change", () => { P.auto = autoEl.checked; });

  document.querySelectorAll("[data-preset]").forEach((btn) => {
    btn.addEventListener("click", () => {
      document.querySelectorAll("[data-preset]").forEach((b) => b.classList.remove("is-on"));
      btn.classList.add("is-on");
      Object.assign(P, PRESETS[btn.dataset.preset]);
      ctrls.forEach((c) => c.__sync());
      markDirty();
    });
  });
  const dbgBox = document.getElementById("dbgBtns");
  [["OFF", 0], ["NOISE", 1], ["STATS", 2], ["SLICE", 4], ["STEPS", 6]].forEach(([label, val]) => {
    const b = document.createElement("b");
    b.textContent = " " + label + " ";
    b.style.cursor = "pointer";
    b.style.color = P.debug === val ? "var(--accent)" : "var(--muted)";
    b.addEventListener("click", () => {
      P.debug = val; markDirty();
      [...dbgBox.children].forEach((c) => { c.style.color = "var(--muted)"; });
      b.style.color = "var(--accent)";
    });
    dbgBox.appendChild(b);
  });
  document.getElementById("pause").addEventListener("click", (e) => {
    P.paused = !P.paused; e.target.textContent = P.paused ? "RESUME" : "PAUSE";
  });
  const resetBtn = document.getElementById("reset");
  resetBtn.addEventListener("click", () => {
    Object.assign(P, { scale: 0.70, steps: 56, light: 5, aerial: true, accumulate: true, auto: true, paused: false, debug: 0 }, PRESETS.cumulus);
    aerialEl.checked = accumEl.checked = autoEl.checked = true;
    document.getElementById("pause").textContent = "PAUSE";
    ctrls.forEach((c) => c.__sync()); markDirty();
  });

  function basis(yaw, pitch) {
    const cy = Math.cos(yaw), sy = Math.sin(yaw), cp = Math.cos(pitch), sp = Math.sin(pitch);
    return new Float32Array([
      cy, 0, sy,
      -sy * sp, cp, cy * sp,
      -sy * cp, -sp, cy * cp,
    ]);
  }

  const msEl = document.getElementById("ms"), resEl = document.getElementById("res");
  const stepStat = document.getElementById("stepStat"), skipInfo = document.getElementById("skipInfo");
  const accInfo = document.getElementById("accInfo"), autoInfo = document.getElementById("autoInfo");
  let simTime = 0, lastNow = performance.now(), smoothed = 16, frameIdx = 0, accumFrames = 0;

  function pushUniforms(prog, w, h) {
    const el = Math.sin(P.sunEl * Math.PI / 180), az = P.sunAz * Math.PI / 180;
    const sd = [Math.cos(el) * Math.sin(az), Math.sin(el), -Math.cos(el) * Math.cos(az)];
    const top = Math.max(P.top, P.base + 200);
    u2f(prog, "uRes", w, h);
    u2f(prog, "uSeedXZ", P.seedX, P.seedZ);
    u1f(prog, "uTime", simTime);
    u1f(prog, "uJitter", (frameIdx * 0.6180339887498949) % 1);
    u3f(prog, "uCamPos", cam.pos[0], cam.pos[1], cam.pos[2]);
    um3(prog, "uCamBasis", basis(cam.yaw, cam.pitch));
    u1f(prog, "uFovTan", Math.tan(cam.fov * 0.5));
    u1f(prog, "uAspect", w / Math.max(1, h));
    u1i(prog, "uNoise", 0); u1i(prog, "uWorley", 1);
    u1f(prog, "uNoiseLo", nPct[0]); u1f(prog, "uNoiseHi", nPct[1]);
    u1f(prog, "uWorleyLo", wPct[0]); u1f(prog, "uWorleyHi", wPct[1]);
    u1f(prog, "uCoverage", P.coverage); u1f(prog, "uType", P.type);
    u1f(prog, "uDensityMul", P.density); u1f(prog, "uDetail", P.detail);
    u1f(prog, "uBase", P.base); u1f(prog, "uTop", top);
    u1f(prog, "uMaxDist", P.maxDist); u1f(prog, "uWind", P.wind);
    u3f(prog, "uSunDir", sd[0], sd[1], sd[2]);
    u3f(prog, "uSunColor", SUN_RAD[0], SUN_RAD[1], SUN_RAD[2]);
    u3f(prog, "uSkyTop", SKY_TOP[0], SKY_TOP[1], SKY_TOP[2]);
    u3f(prog, "uSkyHorizon", SKY_HOR[0], SKY_HOR[1], SKY_HOR[2]);
    u3f(prog, "uHazeColor", HAZE_C[0], HAZE_C[1], HAZE_C[2]);
    u1f(prog, "uSkyScale", 1.0);
    u1f(prog, "uAerial", P.aerial ? 1 : 0);
    u1f(prog, "uAerialK", 2.4e-5 * P.haze);
    u1f(prog, "uHazeK", P.haze);
    u1f(prog, "uMSContrib", P.msContrib); u1f(prog, "uMSOccl", P.msOccl);
    u1f(prog, "uPowder", P.powder);
    u1f(prog, "uPhaseG", 0.78); u1f(prog, "uPhaseMix", 0.40);
    u1f(prog, "uAmbScale", 1.0);
    u1i(prog, "uSteps", Math.max(4, P.steps | 0));
    u1i(prog, "uLightSteps", Math.max(1, P.light | 0));
    u1f(prog, "uStoreLdr", HDR ? 0 : 1);
    u1f(prog, "uDebug", P.debug || 0);
  }

  const NO_TEX3D = () => { gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_3D, null); gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_3D, null); };
  function bindNoise() {
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_3D, texNoise);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_3D, texWorley);
  }

  function frame(now) {
    const dt = Math.min(0.06, (now - lastNow) / 1000);
    lastNow = now;
    if (!P.paused) simTime += dt;
    if (!document.hidden) {
      if (ensureSize()) dirty = true;
      if (dirty) { accumFrames = 0; dirty = false; }

      gl.bindVertexArray(vao);
      gl.disable(gl.BLEND);
      gl.disable(gl.DEPTH_TEST);

      /* ① CLOUD pass —— 只算云：预乘内散射 + 透射率 */
      bindRT(rtCloud);
      gl.useProgram(progCloud);
      bindNoise();
      pushUniforms(progCloud, rtW, rtH);
      gl.drawArrays(gl.TRIANGLES, 0, 3);

      /* ② ACCUM pass —— 分帧累积，把抖动噪声换成细节 */
      const doAccum = P.accumulate && HDR;
      const blend = doAccum ? (accumFrames === 0 ? 1.0 : 1.0 / Math.min(accumFrames + 1, 24)) : 1.0;
      bindRT(rtAccB);
      gl.useProgram(progAccum);
      gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, rtCloud.tex);
      gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, rtAccA.tex);
      u1i(progAccum, "uCur", 0); u1i(progAccum, "uPrev", 1);
      u1f(progAccum, "uBlend", blend);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      const swap = rtAccA; rtAccA = rtAccB; rtAccB = swap;
      accumFrames++;

      /* ③ COMPOSITE pass —— 天空 × 透射率 + 内散射，全分辨率 + tonemap */
      bindRT(null);
      gl.useProgram(progComp);
      bindNoise();
      pushUniforms(progComp, cw, ch);
      gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, rtAccA.tex);
      u1i(progComp, "uAccumTex", 0);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      NO_TEX3D();
      frameIdx++;
    }

    smoothed = smoothed * 0.9 + (performance.now() - now) * 0.1;
    if (P.auto && frameIdx > 0 && frameIdx % 24 === 0) {
      if (smoothed > P.budgetMs * 1.15) {
        if (P.scale > 0.36) P.scale = Math.max(0.35, P.scale * 0.9);
        else if (P.steps > 20) P.steps = Math.max(20, P.steps - 4);
      } else if (smoothed < P.budgetMs * 0.70) {
        if (P.steps < 96) P.steps = Math.min(96, P.steps + 4);
        else if (P.scale < 1.0) P.scale = Math.min(1.0, P.scale * 1.1);
      }
      ctrls[11].__sync(); ctrls[13].__sync();
    }
    msEl.textContent = smoothed.toFixed(1) + " ms";
    resEl.textContent = cw + "×" + ch + (rtW ? " → " + rtW + "×" + rtH : "");
    stepStat.textContent = (P.steps | 0) + " steps × " + (P.light | 0) + " light";
    skipInfo.textContent = (P.top | 0) + "m 壳层 · 几何步长 ×1.02（无探针格）";
    accInfo.textContent = (P.accumulate && HDR) ? Math.min(accumFrames, 24) + " 帧" : (HDR ? "关" : "无浮点RT");
    autoInfo.textContent = P.auto ? "AUTO " + P.scale.toFixed(2) + "× / " + (P.steps | 0) : "手动";
    window.__labStats = {
      ms: +smoothed.toFixed(2), w: cw, h: ch, cloudW: rtW, cloudH: rtH,
      steps: P.steps | 0, light: P.light | 0, scale: +P.scale.toFixed(3),
      accum: P.accumulate && HDR ? Math.min(accumFrames, 24) : 0, hdr: HDR,
      noiseMs, worleyMs, type: +P.type.toFixed(2),
    };
    requestAnimationFrame(frame);
  }

  /* URL 覆盖：?preset=storm&steps=32&light=3&scale=0.45&pitch=0.2&type=2&debug=6 */
  (function applyQuery() {
    const q = new URLSearchParams(location.search);
    const preset = q.get("preset");
    if (preset && PRESETS[preset]) {
      Object.assign(P, PRESETS[preset]);
      document.querySelectorAll("[data-preset]").forEach((b) => b.classList.toggle("is-on", b.dataset.preset === preset));
    }
    ["coverage","type","density","detail","base","top","wind","sunEl","sunAz","haze",
     "steps","light","scale","msContrib","msOccl","powder","budgetMs","seedX","seedZ"].forEach((k) => {
      const v = q.get(k); if (v !== null) P[k] = parseFloat(v);
    });
    if (q.get("maxdist")) P.maxDist = parseFloat(q.get("maxdist"));
    if (q.get("aerial") !== null) P.aerial = q.get("aerial") !== "0";
    if (q.get("accum") !== null) P.accumulate = q.get("accum") !== "0";
    if (q.get("auto") !== null) P.auto = q.get("auto") !== "0";
    if (q.get("debug") !== null) P.debug = parseFloat(q.get("debug"));
    if (q.get("pitch")) cam.pitch = parseFloat(q.get("pitch"));
    if (q.get("yaw")) cam.yaw = parseFloat(q.get("yaw"));
    if (q.get("fov")) cam.fov = parseFloat(q.get("fov")) * Math.PI / 180;
    if (q.get("camY")) cam.pos[1] = parseFloat(q.get("camY"));
    if (q.get("camX")) cam.pos[0] = parseFloat(q.get("camX"));
    if (q.get("camZ")) cam.pos[2] = parseFloat(q.get("camZ"));
    aerialEl.checked = P.aerial; accumEl.checked = P.accumulate; autoEl.checked = P.auto;
    ctrls.forEach((c) => c.__sync());
    dirty = true;
  })();

  window.__lab = {
    P, cam,
    set: (patch) => { Object.assign(P, patch); ctrls.forEach((c) => c.__sync()); dirty = true; },
    stats: () => window.__labStats,
    hdr: HDR,
  };
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
